<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#3a6b4f">
<title>Nest</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%AA%BA%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
/* ============================================================
   NEST — Material 3 Expressive design tokens
   ============================================================ */
:root{
  --primary:#3a6b4f; --on-primary:#ffffff;
  --primary-container:#bcefc9; --on-primary-container:#00210f;
  --secondary:#8a5a2b; --secondary-container:#ffdcb8; --on-secondary-container:#2c1600;
  --tertiary:#3c6472; --tertiary-container:#c0e9fa; --on-tertiary-container:#001f28;
  --error:#ba1a1a; --error-container:#ffdad6; --on-error-container:#410002;
  --surface:#f7fbf3; --on-surface:#181d18;
  --surface-dim:#d7dbd2; --surface-bright:#f7fbf3;
  --surface-container-lowest:#ffffff; --surface-container-low:#f1f5ec;
  --surface-container:#ebefe6; --surface-container-high:#e5eae1; --surface-container-highest:#e0e4db;
  --on-surface-variant:#414941; --outline:#717970; --outline-variant:#c1c9bd;
  --success:#2e7d32; --warn:#c77800;
  --shadow:0 1px 3px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.08);
  --shadow-lg:0 4px 12px rgba(0,0,0,.15);
  --r-xs:8px; --r-sm:12px; --r-md:16px; --r-lg:24px; --r-xl:28px; --r-full:999px;
  --nav-h:80px;
}
:root[data-theme="dark"]{
  --primary:#a1d3ac; --on-primary:#093920; --primary-container:#235135; --on-primary-container:#bcefc9;
  --secondary:#f5bd7e; --secondary-container:#6a4014; --on-secondary-container:#ffdcb8;
  --tertiary:#a4cddd; --tertiary-container:#234c59; --on-tertiary-container:#c0e9fa;
  --error:#ffb4ab; --error-container:#93000a; --on-error-container:#ffdad6;
  --surface:#0f140f; --on-surface:#dfe4db;
  --surface-dim:#0f140f; --surface-bright:#353a34;
  --surface-container-lowest:#0a0f0a; --surface-container-low:#181d18;
  --surface-container:#1c211b; --surface-container-high:#262b25; --surface-container-highest:#313630;
  --on-surface-variant:#c1c9bd; --outline:#8b938a; --outline-variant:#414941;
  --success:#7fdd84; --warn:#f5bd7e;
  --shadow:0 1px 3px rgba(0,0,0,.4); --shadow-lg:0 4px 16px rgba(0,0,0,.5);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --primary:#a1d3ac; --on-primary:#093920; --primary-container:#235135; --on-primary-container:#bcefc9;
    --secondary:#f5bd7e; --secondary-container:#6a4014; --on-secondary-container:#ffdcb8;
    --tertiary:#a4cddd; --tertiary-container:#234c59; --on-tertiary-container:#c0e9fa;
    --error:#ffb4ab; --error-container:#93000a; --on-error-container:#ffdad6;
    --surface:#0f140f; --on-surface:#dfe4db;
    --surface-dim:#0f140f; --surface-bright:#353a34;
    --surface-container-lowest:#0a0f0a; --surface-container-low:#181d18;
    --surface-container:#1c211b; --surface-container-high:#262b25; --surface-container-highest:#313630;
    --on-surface-variant:#c1c9bd; --outline:#8b938a; --outline-variant:#414941;
    --success:#7fdd84; --warn:#f5bd7e;
    --shadow:0 1px 3px rgba(0,0,0,.4); --shadow-lg:0 4px 16px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Segoe UI',Roboto,system-ui,-apple-system,sans-serif;
  background:var(--surface); color:var(--on-surface);
  overscroll-behavior-y:none; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:16px}
h1,h2,h3,h4{margin:0;font-weight:600}
.hidden{display:none!important}

/* ---------- App shell ---------- */
#app{max-width:1100px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
/* Sticky header groups the top bar + Personal/Shared toggle so the toggle
   stays pinned while scrolling — you can always see which space you're on. */
.appheader{position:sticky;top:0;z-index:20;background:var(--surface)}
.topbar{
  padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;
  display:flex;align-items:center;gap:12px;
}
.topbar .title{font-size:1.6rem;font-weight:700;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
.topbar .title .logo{font-size:1.5rem}
.topbar .spacer{flex:1}
.icon-btn{width:44px;height:44px;border-radius:var(--r-full);display:grid;place-items:center;font-size:1.3rem;color:var(--on-surface-variant)}
.icon-btn:active{background:var(--surface-container-high)}
.save-dot{height:26px;min-width:26px;padding:0 8px;border-radius:var(--r-full);display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;border:none;cursor:pointer;background:var(--surface-container-high);color:var(--on-surface-variant);transition:.2s}
.save-dot::before{content:'';width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.save-dot.idle{opacity:.55}
.save-dot.idle::after,.save-dot.saved::after{content:'Saved'}
.save-dot.saving{color:#8a6d00;background:rgba(226,183,20,.16)}
.save-dot.saving::after{content:'Saving…'}
.save-dot.saved{color:var(--primary);background:rgba(58,107,79,.14)}
.save-dot.offline{color:#7a4f18;background:rgba(196,120,32,.16)}
.save-dot.offline::after{content:'Offline'}
.save-dot.error{color:#b3261e;background:rgba(179,38,30,.14)}
.save-dot.error::after{content:'Not saved'}
.save-dot.saving::before{animation:pulseDot 1s infinite}
@keyframes pulseDot{0%,100%{opacity:.4}50%{opacity:1}}
.bk-row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--outline-variant)}
.bk-row .bk-main{flex:1;min-width:0}
.bk-tag{font-size:.66rem;font-weight:600;padding:2px 7px;border-radius:var(--r-full);background:var(--surface-container-high);color:var(--on-surface-variant)}

/* ---------- Segmented space toggle ---------- */
.segmented{display:flex;background:var(--surface-container);border-radius:var(--r-full);padding:4px;margin:4px 16px 12px;gap:4px}
.segmented button{flex:1;padding:10px;border-radius:var(--r-full);font-weight:600;font-size:.95rem;color:var(--on-surface-variant);display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.segmented button.active{background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow)}

/* ---------- Content ---------- */
.content{padding:0 16px}
.view{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- Cards ---------- */
.card{background:var(--surface-container-low);border-radius:var(--r-lg);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{font-size:1rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card .sub{color:var(--on-surface-variant);font-size:.85rem}

/* month selector */
.month-nav{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 16px 14px}
.month-nav button{width:40px;height:40px;border-radius:var(--r-full);background:var(--surface-container);font-size:1.2rem;display:grid;place-items:center}
.month-nav .label{font-weight:600;min-width:150px;text-align:center;font-size:1.05rem}

/* summary grid */
.sum-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.sum-tile{background:var(--surface-container-low);border-radius:var(--r-md);padding:14px 12px;text-align:center;box-shadow:var(--shadow)}
.sum-tile .lbl{font-size:.72rem;color:var(--on-surface-variant);text-transform:uppercase;letter-spacing:.4px}
.sum-tile .val{font-size:1.15rem;font-weight:700;margin-top:4px}
.sum-tile.income .val{color:var(--success)}
.sum-tile.expense .val{color:var(--secondary)}
.sum-tile.save .val.pos{color:var(--primary)} .sum-tile.save .val.neg{color:var(--error)}

/* progress bars */
.bar-row{margin-bottom:14px}
.bar-row .top{display:flex;justify-content:space-between;font-size:.9rem;margin-bottom:5px}
.bar-row .top .amt{color:var(--on-surface-variant)}
.bar-row .top .amt b{color:var(--on-surface)}
.track{height:10px;background:var(--surface-container-high);border-radius:var(--r-full);overflow:hidden}
.fill{height:100%;background:var(--primary);border-radius:var(--r-full);transition:width .4s}
.fill.over{background:var(--error)}
.fill.warn{background:var(--warn)}
.pill{font-size:.7rem;padding:2px 8px;border-radius:var(--r-full);font-weight:600}
.pill.over{background:var(--error-container);color:var(--on-error-container)}
.pill.ok{background:var(--primary-container);color:var(--on-primary-container)}

/* 50/30/20 */
.tri{display:flex;height:22px;border-radius:var(--r-full);overflow:hidden;margin:6px 0 10px}
.tri span{display:block;height:100%}
.tri .need{background:var(--primary)} .tri .want{background:var(--secondary)} .tri .sav{background:var(--tertiary)}
.tri-legend{display:flex;gap:14px;font-size:.8rem;flex-wrap:wrap}
.tri-legend .k{display:flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block}

/* settle card */
.settle{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.settle .big{font-size:1.5rem;font-weight:800;margin:4px 0}

/* transactions */
.tx-day{font-size:.8rem;color:var(--on-surface-variant);font-weight:600;margin:14px 4px 6px}
.tx{display:flex;align-items:center;gap:12px;background:var(--surface-container-low);border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.tx .ic{width:42px;height:42px;border-radius:var(--r-full);background:var(--primary-container);color:var(--on-primary-container);display:grid;place-items:center;font-size:1.1rem;flex-shrink:0}
.tx.inc .ic{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.tx .mid{flex:1;min-width:0}
.tx .mid .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .mid .t2{font-size:.8rem;color:var(--on-surface-variant);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-weight:700;white-space:nowrap}
.tx .amt.inc{color:var(--success)}
.tx.reflected{opacity:.9;background:var(--surface-container);border:1px dashed var(--outline-variant)}
.tag{display:inline-block;font-size:.66rem;font-weight:700;padding:1px 7px;border-radius:var(--r-full);background:var(--secondary-container);color:var(--on-secondary-container);vertical-align:middle;margin-left:4px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:var(--r-full);background:var(--surface-container-high);font-size:.9rem;font-weight:500;border:1.5px solid transparent}
.chip.active{background:var(--primary-container);color:var(--on-primary-container);border-color:var(--primary)}
.chip.small{padding:6px 12px;font-size:.82rem}

/* forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:.82rem;color:var(--on-surface-variant);margin-bottom:6px;font-weight:500}
.input,select.input{width:100%;padding:13px 14px;border-radius:var(--r-sm);border:1.5px solid var(--outline-variant);background:var(--surface-container-lowest);color:var(--on-surface)}
.input:focus{outline:none;border-color:var(--primary)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:var(--r-full);font-weight:600;font-size:.95rem;transition:.15s}
.btn.filled{background:var(--primary);color:var(--on-primary)}
.btn.filled:active{filter:brightness(.92)}
.btn.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn.outline{border:1.5px solid var(--outline);color:var(--primary)}
.btn.text{color:var(--primary);padding:12px 16px}
.btn.danger{background:var(--error-container);color:var(--on-error-container)}
.btn.block{width:100%}
.btn:disabled{opacity:.4;pointer-events:none}

/* FAB / bottom nav */
.navbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--surface-container);display:flex;align-items:center;justify-content:space-around;
  box-shadow:0 -1px 8px rgba(0,0,0,.08);max-width:1100px;margin:0 auto;
}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--on-surface-variant);font-size:.7rem;font-weight:500;padding:8px;min-width:56px}
.nav-item .ni{font-size:1.35rem;line-height:1;padding:4px 16px;border-radius:var(--r-full);transition:.15s}
.nav-item.active{color:var(--primary)}
.nav-item.active .ni{background:var(--primary-container);color:var(--on-primary-container)}
.fab{
  width:60px;height:60px;border-radius:var(--r-lg);background:var(--primary);color:var(--on-primary);
  display:grid;place-items:center;font-size:1.8rem;box-shadow:var(--shadow-lg);margin-top:-18px
}
.fab:active{filter:brightness(.92)}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40;opacity:0;pointer-events:none;transition:.2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface-container-low);
  border-radius:var(--r-xl) var(--r-xl) 0 0;padding:8px 20px calc(24px + env(safe-area-inset-bottom));
  max-width:600px;margin:0 auto;transform:translateY(110%);transition:transform .28s cubic-bezier(.2,.8,.2,1);
  max-height:92vh;overflow-y:auto
}
.sheet.show{transform:translateY(0)}
.grabber{width:36px;height:4px;background:var(--outline-variant);border-radius:2px;margin:6px auto 14px}
.sheet h2{font-size:1.2rem;margin-bottom:16px}

/* amount display for add */
.amount-display{text-align:center;padding:14px 0 6px}
.amount-display .cur{font-size:1.4rem;color:var(--on-surface-variant);vertical-align:top}
.amount-display .num{font-size:3rem;font-weight:800;letter-spacing:-1px;overflow-wrap:anywhere}
.amount-display .num.expr{font-size:2rem;letter-spacing:0}
.calc-preview{min-height:20px;margin-top:2px;color:var(--primary);font-weight:700;font-size:1rem}
.type-toggle{display:flex;gap:8px;justify-content:center;margin:10px 0 18px}
.type-toggle button{padding:8px 20px;border-radius:var(--r-full);background:var(--surface-container-high);font-weight:600;font-size:.9rem}
.type-toggle button.active.exp{background:var(--secondary-container);color:var(--on-secondary-container)}
.type-toggle button.active.inc{background:var(--tertiary-container);color:var(--on-tertiary-container)}

/* keypad */
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.keypad.calc{grid-template-columns:repeat(4,1fr)}
.key{padding:16px;border-radius:var(--r-md);background:var(--surface-container-high);font-size:1.4rem;font-weight:600;text-align:center;cursor:pointer;user-select:none}
.key:active{background:var(--primary-container)}
.key.op{background:var(--surface-container-highest);color:var(--primary);font-weight:800}
.key.op:active{background:var(--primary-container);color:var(--on-primary-container)}
.key.eq{grid-column:1/-1;background:var(--primary);color:var(--on-primary)}
.key.eq:active{filter:brightness(.94);background:var(--primary)}
.kb-hint{display:none;text-align:center;margin:-6px 0 12px}
@media(min-width:900px){ .kb-hint{display:block} }

/* insights bars */
.mbars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.mbar{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.mbar .stack{width:100%;display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:2px}
.mbar .seg{width:100%;border-radius:4px 4px 0 0}
.mbar .seg.inc{background:var(--tertiary)} .mbar .seg.exp{background:var(--secondary)}
.mbar .ml{font-size:.65rem;color:var(--on-surface-variant)}

/* empty state */
.empty{text-align:center;padding:50px 20px;color:var(--on-surface-variant)}
.empty .em{font-size:3rem;margin-bottom:10px}

/* auth / signin */
.signin-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;gap:8px}
.signin-wrap .logo-big{font-size:4rem}
.signin-wrap h1{font-size:2.2rem;letter-spacing:-1px}
.signin-wrap p{color:var(--on-surface-variant);max-width:320px;margin:0 0 20px}
.gbtn{display:flex;align-items:center;gap:12px;background:var(--surface-container-lowest);border:1.5px solid var(--outline-variant);padding:13px 22px;border-radius:var(--r-full);font-weight:600;box-shadow:var(--shadow)}

/* toast */
.toast{position:fixed;bottom:calc(var(--nav-h) + 20px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--on-surface);color:var(--surface);padding:12px 20px;border-radius:var(--r-full);font-size:.9rem;font-weight:500;z-index:100;opacity:0;transition:.25s;box-shadow:var(--shadow-lg);white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* small helpers */
.muted{color:var(--on-surface-variant)}
.right{text-align:right}
.flex{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}
.testbar{background:var(--secondary-container);color:var(--on-secondary-container);font-size:.78rem;padding:6px 16px;text-align:center;font-weight:600}
.member-badge{font-size:.7rem;padding:2px 8px;border-radius:var(--r-full);background:var(--surface-container-high);color:var(--on-surface-variant)}

/* responsive: unfolded / tablet */
@media(min-width:700px){
  .sum-grid{gap:14px}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
  .two-col .card{margin-bottom:0}
}

/* responsive: desktop / web — bottom bar becomes a left nav rail */
@media(min-width:900px){
  /* bottom nav -> vertical left rail */
  .navbar{
    flex-direction:column;justify-content:flex-start;align-items:center;
    left:0;right:auto;top:0;bottom:0;width:96px;height:100vh;
    padding:22px 0 24px;gap:8px;margin:0;max-width:none;
    box-shadow:1px 0 12px rgba(0,0,0,.06);border-right:1px solid var(--outline-variant);
  }
  .nav-item{width:100%;min-width:0;padding:11px 4px;gap:4px;font-size:.72rem}
  .fab{margin:8px 0 12px;width:54px;height:54px;font-size:1.6rem}
  /* content shifts clear of the rail; inner column stays a comfortable width */
  #app{max-width:none;margin:0;padding-left:96px;padding-bottom:36px}
  .topbar,.segmented,.month-nav,.content{max-width:940px;margin-left:auto;margin-right:auto}
  .topbar{padding-top:20px}
  .segmented{margin-top:6px;margin-bottom:14px}
  .month-nav{margin-top:0;margin-bottom:16px}
  /* toast centered over the content area, not the whole window */
  .toast{left:calc(50% + 48px);bottom:24px}
}

/* wide desktop — cap the reading column and center it in the extra space */
@media(min-width:1280px){
  .topbar,.segmented,.month-nav,.content{max-width:1040px}
  .toast{left:calc(50% + 48px)}
}
</style>
</head>
<body>

<!-- SIGN IN -->
<div id="signin" class="signin-wrap hidden">
  <div class="logo-big">🪺</div>
  <h1>Nest</h1>
  <p>Your shared home for budgeting. Track spending, plan together, split expenses.</p>
  <button class="gbtn" onclick="doSignIn()">
    <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.7 1.22 9.2 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    Sign in with Google
  </button>
  <p class="muted" id="testSigninNote" style="font-size:.8rem"></p>
</div>

<!-- MAIN APP -->
<div id="app" class="hidden">
  <div id="testbar" class="testbar hidden"></div>
  <div class="appheader">
    <div class="topbar">

/* ---------- safe storage (localStorage throws inside data: URLs / private mode) ---------- */
const _mem = {};
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return (k in _mem)?_mem[k]:null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){ _mem[k]=v; } }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){ delete _mem[k]; } }

/* ---------------- FIREBASE MODE ---------------- */
function signinMsg(t){ const el=document.getElementById('testSigninNote'); if(el) el.textContent=t||''; }
function signInError(e){
  if(!e) return;
  const map={
    'auth/operation-not-allowed':'Google sign-in isn’t enabled yet in Firebase (Authentication → Sign-in method).',
    'auth/unauthorized-domain':'This domain isn’t authorized in Firebase (Authentication → Settings → Authorized domains).',
    'auth/popup-blocked':'Your browser blocked the popup — retrying with a redirect…',
    'auth/network-request-failed':'Network error — check your connection and try again.'
  };
  signinMsg(map[e.code] || ('Sign-in error: '+(e.code||e.message||e)));
}
function bootFirebase(){
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth(); db = firebase.database();
  watchConnection();
  try{ auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); }catch(e){}

  auth.getRedirectResult().catch(e=>signInError(e));
  auth.onAuthStateChanged(async u=>{

      user={uid:u.uid,name:u.displayName||'Me',email:u.email,photo:u.photoURL||''};
      signinMsg('');
      showApp();
      attachPersonal();
      attachSharedIfMember();
      db.ref('users/'+u.uid).update({name:user.name,email:user.email,photo:user.photo}).catch(()=>{});

function doSignIn(){
  if(TEST_MODE){ toast('Test mode — already signed in'); return; }
  signinMsg('Opening Google sign-in…');
  const provider=new firebase.auth.GoogleAuthProvider();

      if(e && (e.code==='auth/popup-blocked' || e.code==='auth/cancelled-popup-request' || e.code==='auth/popup-closed-by-user' || e.code==='auth/operation-not-supported-in-this-environment')){
        signinMsg('Redirecting to Google…');
        auth.signInWithRedirect(provider).catch(err=>signInError(err));
      } else {
        signInError(e);
      }

}
function attachPersonal(){
  db.ref('personal/'+user.uid).on('value',snap=>{
    const v=snap.val();
    if(v){ data.personal=normalizeSpace(v); }
    else {
      // Cloud is empty. Before seeding a blank budget (which would overwrite the cloud),
      // check for an on-device copy — if one exists, the cloud was likely wiped: recover it.
      const m=readMirror('personal');
      if(m){ data.personal=normalizeSpace(m.sp); saveSpace('personal'); toast('⚠️ Cloud was empty — recovered your budget from this device’s backup'); }
      else { data.personal=seedFirstTime('personal'); db.ref('personal/'+user.uid).set(stripForSave(data.personal)); }

    runRecurring(data.personal);
    if(!TEST_MODE) render();
    maybeBackup('personal');
  }, err=>{
    if(err && err.code==='PERMISSION_DENIED') toast('Database rules not set yet — publish the security rules in Firebase.');

function attachShared(sid){
  if(!sid) return;
  db.ref('shared/'+sid).off();
  db.ref('shared/'+sid).on('value',s=>{
    const v=s.val(); data.shared = v?normalizeSpace(v):null;
    data.shared && (data.shared.id=sid);
    runRecurring(data.shared);
    render();
    if(data.shared) maybeBackup('shared');
  });
}
async function attachSharedIfMember(){
  const snap = await db.ref('users/'+user.uid+'/sharedSpace').get();
  attachShared(snap.val());
}
function seedFirstTime(which){
  const sp=blankSpace(); sp.categories=buildDefaultCats(); sp.settings.savingsGoal=0; return sp;
}

/* =====================================================================
   PERSISTENCE  (honest save status + device mirror + cloud/local backups)
   ===================================================================== */
function setSaveState(s){
  saveState=s;
  const el=document.getElementById('saveDot'); if(!el) return;
  el.className='save-dot '+s;
  el.title={ idle:'All changes saved', saving:'Saving to the cloud…', saved:'All changes saved to the cloud',
    offline:'Offline — your changes are kept on this device and sync when you reconnect',
    error:'Couldn’t save to the cloud — a copy is kept on this device. Tap to back up / restore.'
  }[s]||'';
}
function idPartFor(which){ const sp=which==='shared'?data.shared:data.personal; return which==='shared'?(sp&&sp.id):(user&&user.uid); }
function mirrorKey(which){ return 'nest_mirror_'+which+'_'+idPartFor(which); }
function writeMirror(which,sp){ try{ lsSet(mirrorKey(which), JSON.stringify({sp:stripForSave(sp), at:Date.now()})); }catch(e){} }
function readMirror(which){ try{ const m=JSON.parse(lsGet(mirrorKey(which))||'null'); return (m&&m.sp&&(asArray(m.sp.transactions).length||asArray(m.sp.categories).length))?m:null; }catch(e){ return null; } }

function saveSpace(which){
  const sp = which==='personal'?data.personal:data.shared;
  if(!sp) return Promise.resolve();
  if(TEST_MODE){
    if(which==='personal') lsSet('nest_personal_'+user.uid, JSON.stringify(sp));
    else lsSet('nest_shared', JSON.stringify(sp));
    return Promise.resolve();
  }
  // 1) device-side safety net FIRST — survives a failed or offline cloud write
  writeMirror(which, sp);
  // 2) cloud write with honest status
  const path = which==='personal' ? 'personal/'+user.uid : 'shared/'+sp.id;
  setSaveState(isOnline?'saving':'offline');
  return db.ref(path).set(stripForSave(sp))
    .then(()=>{ setSaveState('saved'); maybeBackup(which); })
    .catch(err=>{
      setSaveState('error');
      console.warn('Nest save failed', err);
      toast('⚠️ Couldn’t save to the cloud — a copy is safe on this device'+((err&&err.code==='PERMISSION_DENIED')?' (check Firebase rules)':''));
    });
}
function stripForSave(sp){ const c={...sp}; delete c.id; return c; }

/* ---- connection awareness ---- */
function watchConnection(){
  try{
    db.ref('.info/connected').on('value',s=>{
      isOnline=!!s.val();
      if(!isOnline){ if(saveState!=='error') setSaveState('offline'); }
      else if(saveState==='offline'){ setSaveState('saved'); }
    });
  }catch(e){}
}

/* ---- BACKUPS ------------------------------------------------------- */
function nowStamp(){ const d=new Date(); const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())+p(d.getSeconds()); }
function backupBase(which){ const idp=idPartFor(which); return 'backups/'+user.uid+'/'+(which==='shared'?'shared_'+idp:'personal'); }
function localBkKey(which){ return 'nest_localbk_'+which+'_'+idPartFor(which); }

function maybeBackup(which){                 // one automatic snapshot per calendar day
  if(!user) return;
  const sp=which==='shared'?data.shared:data.personal; if(!sp) return;
  const today=todayStr(); const flag='nest_lastbackup_'+which+'_'+idPartFor(which);
  if(lsGet(flag)===today) return;
  lsSet(flag, today);
  writeBackup(which, today, 'auto');
}
function backupNow(which,label){             // forced snapshot (manual / before a restore)
  if(!user) return;
  const sp=which==='shared'?data.shared:data.personal; if(!sp){ toast('Nothing to back up'); return; }
  writeBackup(which, nowStamp(), label||'manual');
}
function writeBackup(which, key, label){
  const sp=which==='shared'?data.shared:data.personal; if(!sp) return;
  const snap={ data:stripForSave(sp), at:Date.now(), day:key, label:label||'auto', txCount:asArray(sp.transactions).length };
  // local (always works, no rules needed)
  let arr=[]; try{ arr=JSON.parse(lsGet(localBkKey(which))||'[]'); }catch(e){}
  arr=arr.filter(b=>b.day!==key); arr.push(snap); arr.sort((a,b)=>a.at-b.at);
  while(arr.length>BACKUP_KEEP_LOCAL) arr.shift();
  lsSet(localBkKey(which), JSON.stringify(arr));
  if(TEST_MODE || !db) return;               // local-only in test / before Firebase is ready
  // cloud (best-effort; needs the backups rule)
  const base=backupBase(which);
  db.ref(base+'/'+key).set(snap)
    .then(()=>pruneCloudBackups(base))
    .catch(err=>{ if(err&&err.code==='PERMISSION_DENIED') hintBackupRules(); });
}
function pruneCloudBackups(base){
  db.ref(base).get().then(s=>{ const v=s.val()||{}; const keys=Object.keys(v).sort();
    while(keys.length>BACKUP_KEEP_CLOUD){ const k=keys.shift(); db.ref(base+'/'+k).remove().catch(()=>{}); }
  }).catch(()=>{});
}
function hintBackupRules(){ if(_rulesHinted) return; _rulesHinted=true;
  toast('☁️ On-device backups are on. To enable cloud backups too, add the “backups” rule in Firebase.'); }
function listLocalBackups(which){ try{ return JSON.parse(lsGet(localBkKey(which))||'[]'); }catch(e){ return []; } }

function bkLabel(day){
  const m=String(day).match(/^(\d{4})-(\d{2})-(\d{2})(?:_(\d{2})(\d{2})(\d{2}))?$/);
  if(!m) return day;
  const dt=new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0));
  return m[4]!=null ? dt.toLocaleString('en-CA',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})
                    : dt.toLocaleDateString('en-CA',{month:'short',day:'numeric',year:'numeric'});
}
function openBackups(){
  const which = (activeSpace==='shared' && data.shared) ? 'shared' : 'personal';
  if(TEST_MODE){ openSheetHTML(sheetBackupsHTML(which, [], listLocalBackups(which), 'test')); return; }
  openSheetHTML(sheetBackupsHTML(which, null, listLocalBackups(which), false)); // cloud null = loading
  db.ref(backupBase(which)).get().then(s=>{
    const v=s.val()||{};
    const cloud=Object.keys(v).map(k=>({...v[k], day:v[k].day||k, _src:'cloud'})).sort((a,b)=>b.at-a.at);
    if(document.getElementById('bkSheet')) openSheetHTML(sheetBackupsHTML(which, cloud, listLocalBackups(which), false));
  }).catch(err=>{
    const st = (err&&err.code==='PERMISSION_DENIED')?'denied':'error';
    if(document.getElementById('bkSheet')) openSheetHTML(sheetBackupsHTML(which, [], listLocalBackups(which), st));
  });
}
function sheetBackupsHTML(which, cloud, local, state){
  const spName = which==='shared'?'🤝 Shared':'🧍 Personal';
  const statusLine = (saveState==='saved'||saveState==='idle')?'✓ Your latest changes are saved to the cloud.'
    : saveState==='saving'?'⏳ Saving…'
    : saveState==='offline'?'📴 Offline — changes are kept on this device and sync when you reconnect.'
    : '⚠️ Last cloud save failed — a copy is safe on this device.';
  let h=`<div id="bkSheet" class="grabber"></div>
    <div class="between"><h2 style="margin:0">🛟 Backups &amp; restore</h2>
      <button class="btn text" onclick="backupNow('${which}','manual');toast('Backup saved');setTimeout(openBackups,350)">＋ Back up now</button></div>
    <p class="muted" style="margin:2px 0 8px">Snapshots of your <b>${spName}</b> budget — one saves automatically each day and on this device. Roll back to any of them if something goes wrong.</p>
    <div class="sub" style="margin-bottom:10px">${statusLine}</div>`;
  if(state==='denied') h+=`<div class="card" style="box-shadow:none;background:var(--surface-container)"><b>☁️ Cloud backups need a one-time setup</b><div class="sub mt8">On-device backups already work. To also keep backups in the cloud, add the <code>backups</code> security rule in your Firebase console.</div></div>`;
  const byDay={};
  (cloud||[]).forEach(b=>{ byDay[b.day]={...b,src:'cloud'}; });
  (local||[]).forEach(b=>{ if(byDay[b.day]) byDay[b.day].src='both'; else byDay[b.day]={...b,src:'local'}; });
  const rows=Object.values(byDay).sort((a,b)=>b.at-a.at);
  if(cloud===null) h+=`<div class="sub" style="padding:14px 0;text-align:center">Loading cloud backups…</div>`;
  else if(!rows.length) h+=`<div class="empty"><div class="em">🗂️</div>No backups yet.<br>Your first snapshot saves automatically after your next change.</div>`;
  rows.forEach(b=>{
    const tag=b.src==='both'?'☁️+📱':b.src==='cloud'?'☁️ Cloud':'📱 Device';
    const lbl=b.label==='before-restore'?' · pre-restore':(b.label==='manual'?' · manual':'');
    h+=`<div class="bk-row"><div class="bk-main"><div style="font-weight:600">${bkLabel(b.day)}</div>
      <div class="sub">${b.txCount||0} entries${lbl}</div></div>
      <span class="bk-tag">${tag}</span>
      <button class="btn outline" style="padding:6px 14px;flex:none" onclick="restoreBackup('${which}','${b.src}','${b.day}')">Restore</button></div>`;
  });
  return h;
}
function restoreBackup(which, src, day){
  const apply=(snap)=>{
    if(!snap||!snap.data){ toast('That backup looks empty'); return; }
    const cur=which==='shared'?data.shared:data.personal;
    const curN=asArray(cur&&cur.transactions).length;
    if(!confirm(`Restore the ${bkLabel(day)} backup?\n\nThis replaces your current ${which==='shared'?'Shared':'Personal'} data (${curN} entries) with that snapshot (${snap.txCount||0} entries).\n\nYour current data is backed up first, so you can undo this.`)) return;
    backupNow(which,'before-restore');                 // safety net so a restore is itself reversible
    const restored=normalizeSpace(snap.data);
    if(which==='shared'){ restored.id = (data.shared&&data.shared.id) || idPartFor('shared'); data.shared=restored; }
    else data.personal=restored;
    saveSpace(which); closeSheet(); render(); toast('Restored the '+bkLabel(day)+' backup');
  };
  if((src==='local'||src==='both')){ const b=listLocalBackups(which).find(x=>x.day===day); if(b){ apply(b); return; } }
  db.ref(backupBase(which)+'/'+day).get().then(s=>apply(s.val())).catch(()=>toast('Couldn’t load that backup'));
}

/* normalize: guard against Firebase dropping empty arrays/objects */
function normalizeSpace(sp){
  sp=sp||{};
  return {
    categories: asArray(sp.categories),
    transactions: asArray(sp.transactions),
    settlements: asArray(sp.settlements),
    recurring: asArray(sp.recurring),
    settings: sp.settings || {savingsGoal:0, paycheck:0},
    members: sp.members || {},
    inviteCode: sp.inviteCode || null,
    id: sp.id || null,
  };
}
function asArray(x){ if(!x) return []; if(Array.isArray(x)) return x.filter(Boolean); return Object.values(x).filter(Boolean); }
function buildDefaultCats(){
  const out=[];
  DEFAULT_EXPENSE_CATS.forEach(c=>out.push({id:uid(),name:c.name,icon:c.icon,type:"expense",group:c.group,target:0,useIncomePct:false,targetPct:0}));
  DEFAULT_INCOME_CATS.forEach(c=>out.push({id:uid(),name:c.name,icon:c.icon,type:"income",group:"savings",target:0,useIncomePct:false,targetPct:0}));
  return out;
}

/* =====================================================================
   HELPERS
   ===================================================================== */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function ymKey(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseYM(k){ const [y,m]=k.split('-').map(Number); return new Date(y,m-1,1); }
function monthLabel(k){ return parseYM(k).toLocaleDateString('en-CA',{month:'long',year:'numeric'}); }
function fmt(n){ n=n||0; return CUR_SYMBOL+Math.abs(n).toLocaleString('en-CA',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmt0(n){ n=n||0; return CUR_SYMBOL+Math.round(Math.abs(n)).toLocaleString('en-CA'); }
function curSpace(){ return activeSpace==='personal'?data.personal:data.shared; }
function catById(sp,id){ return (sp.categories||[]).find(c=>c.id===id); }
function txMonth(t){ return t.date? t.date.slice(0,7):''; }

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }

/* =====================================================================
   CALCULATIONS
   ===================================================================== */
function monthTx(sp,ym){ return (sp.transactions||[]).filter(t=>txMonth(t)===ym); }
function sumBy(txs,type){ return txs.filter(t=>t.type===type).reduce((a,t)=>a+(+t.amount||0),0); }
function monthsSpan(sp){ // list of last 6 month keys
  const out=[]; const now=parseYM(viewMonth);
  for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); out.push(ymKey(d)); }
  return out;
}
function catSpentMonth(sp,catId,ym){ return monthTx(sp,ym).filter(t=>t.categoryId===catId&&t.type==='expense').reduce((a,t)=>a+(+t.amount||0),0); }
function monthlySalary(sp){ return (+(sp.settings&&sp.settings.paycheck)||0)*26/12; } // bi-weekly paycheck × 26 / 12

/* ---- date math for recurring ---- */
function fmtDate(dt){ return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
function addDays(ds,n){ const [y,m,d]=ds.split('-').map(Number); const dt=new Date(y,m-1,d); dt.setDate(dt.getDate()+n); return fmtDate(dt); }
function addMonths(ds,n){ const [y,m,d]=ds.split('-').map(Number); let ny=y, nm=m-1+n; ny+=Math.floor(nm/12); nm=((nm%12)+12)%12; const day=Math.min(d, daysInMonth(ny,nm)); return fmtDate(new Date(ny,nm,day)); }
function nextDate(ds,freq){ return freq==='weekly'?addDays(ds,7):freq==='biweekly'?addDays(ds,14):addMonths(ds,1); }
const FREQ_LABEL={weekly:'Weekly', biweekly:'Every 2 weeks', monthly:'Monthly'};

/* ---- shared expense split ---- */
function computeSplit(sp,amt,paidBy,splitType,customMine,customPct){
  const mem=Object.keys(sp.members||{}); const other=mem.find(m=>m!==paidBy); const partner=mem.find(m=>m!==user.uid);
  if(splitType==='full') return {type:'full',shares:{[paidBy]:amt,[other]:0}};
  if(splitType==='custom'){ const mine=parseFloat(customMine)||0; const theirs=Math.round((amt-mine)*100)/100; return {type:'custom',shares:{[user.uid]:mine,[partner]:theirs}}; }
  if(splitType==='custompct'){ const pct=Math.max(0,Math.min(100,parseFloat(customPct)||0)); const mine=Math.round(amt*pct/100*100)/100; const theirs=Math.round((amt-mine)*100)/100; return {type:'custompct',pct,shares:{[user.uid]:mine,[partner]:theirs}}; }
  const half=Math.round(amt/2*100)/100; return {type:'equal',shares:{[paidBy]:amt-half,[other]:half}};
}
/* my portion of a shared expense (for reflecting onto personal) */
function sharedMyShare(t){
  if(t.type!=='expense') return 0;
  const sh=t.split&&t.split.shares;
  if(sh&&sh[user.uid]!=null) return +sh[user.uid]||0;
  return (+t.amount||0)/2;
}
/* synthetic personal expenses = my share of this month's shared expenses, mapped to same-named personal category */
function reflectedFromShared(ym){
  const sh=data.shared; if(!sh) return [];
  const pcats=(data.personal.categories||[]).filter(c=>c.type==='expense');
  return monthTx(sh,ym).filter(t=>t.type==='expense').map(t=>{
    const my=Math.round(sharedMyShare(t)*100)/100; if(my<=0) return null;
    const scat=catById(sh,t.categoryId);
    const pcat = scat? pcats.find(c=>c.name===scat.name) : null;
    return { id:'shr_'+t.id, srcId:t.id, date:t.date, amount:my, type:'expense',
             categoryId: pcat?pcat.id:null, _group:(pcat&&pcat.group)||(scat&&scat.group)||'want',
             _shared:true, icon:(scat&&scat.icon)||'🤝', name:(scat&&scat.name)||'Shared',
             vendor:t.vendor||'', note:'your share of a Shared expense' };
  }).filter(Boolean);
}
/* personal month tx WITH reflected shared shares folded in */
function personalMonthTx(ym){ return monthTx(data.personal,ym).concat(reflectedFromShared(ym)); }
/* effective month tx for whichever space is active */
function effMonthTx(sp,ym){ return (sp===data.personal)? personalMonthTx(ym) : monthTx(sp,ym); }
function spentByCat(txs,catId){ return txs.filter(t=>t.type==='expense'&&t.categoryId===catId).reduce((a,t)=>a+(+t.amount||0),0); }

/* ---- recurring engine ---- */
function spaceKeyOf(sp){ return sp===data.personal?'personal':'shared'; }
function buildRecurringTx(sp,rule,occ){
  const t={id:uid(), date:occ, amount:rule.amount, categoryId:rule.categoryId, vendor:rule.vendor||'', note:rule.note||'', type:rule.type, recurringId:rule.id, occ};
  if(sp===data.shared && rule.type==='expense'){ t.paidBy=rule.paidBy||user.uid; t.split=computeSplit(sp,rule.amount,t.paidBy,rule.splitType||'equal',rule.customMine,rule.customPct); }
  return t;
}
/* materialize occurrences from each rule's anchor up to today (idempotent via occ date) */
function runRecurring(sp){
  if(!sp) return; const rules=asArray(sp.recurring); if(!rules.length) return;
  const todayS=todayStr(); let changed=false;
  sp.transactions=asArray(sp.transactions);
  rules.forEach(rule=>{
    if(rule.active===false || !rule.anchor) return;
    const existing=new Set(sp.transactions.filter(t=>t.recurringId===rule.id).map(t=>t.occ));
    let occ = rule.lastGen ? nextDate(rule.lastGen,rule.freq) : rule.anchor;
    let guard=0;
    while(occ<=todayS && guard<500){
      if(!existing.has(occ)){ sp.transactions.push(buildRecurringTx(sp,rule,occ)); existing.add(occ); changed=true; }
      if(rule.lastGen!==occ){ rule.lastGen=occ; changed=true; }
      occ=nextDate(occ,rule.freq); guard++;
    }
  });
  if(changed) saveSpace(spaceKeyOf(sp));
}
function incomeBasis(sp,ym){ // salary if set, else this month's income, fallback to 3-mo avg
  const sal=monthlySalary(sp); if(sal>0) return sal;
  const im=sumBy(monthTx(sp,ym),'income'); if(im>0) return im;
  let tot=0,n=0; const now=parseYM(ym);
  for(let i=1;i<=3;i++){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); tot+=sumBy(monthTx(sp,ymKey(d)),'income'); n++; }
  return n? tot/n : 0;
}
function effectiveTarget(sp,cat,ym){ if(cat.useIncomePct){ return (cat.targetPct/100)*incomeBasis(sp,ym); } return +cat.target||0; }

/* settle-up between the two members (shared).
   net > 0  => partner owes you;  net < 0 => you owe partner. */
function settleBalance(sp){
  const mem=Object.keys(sp.members||{}); if(mem.length<2) return null;
  const me=user.uid; const other=mem.find(m=>m!==me);
  if(!other) return null;
  let net=0; // running: positive means partner owes me
  (sp.transactions||[]).filter(t=>t.type==='expense'&&t.split).forEach(t=>{
    const shares=(t.split&&t.split.shares)||{};
    const myShare = shares[me]!=null?(+shares[me]):(+t.amount/2);
    const otherShare = shares[other]!=null?(+shares[other]):(+t.amount/2);
    if(t.paidBy===me) net+=otherShare;        // partner owes me their share
    else if(t.paidBy===other) net-=myShare;   // I owe payer my share
  });
  (sp.settlements||[]).forEach(s=>{
    const amt=+s.amount||0;
    if(s.from===other && s.to===me) net-=amt;  // partner paid me back -> they owe me less
    else if(s.from===me && s.to===other) net+=amt; // I paid partner -> I owe less
  });
  net=Math.round(net*100)/100;
  const otherName=(sp.members[other]&&sp.members[other].name)||'Partner';
  return {net, other, otherName};
}

/* =====================================================================
   VIEW: HOME
   ===================================================================== */
function viewHome(){
  const sp=curSpace();
  let h = monthNav();
  const mtx=effMonthTx(sp,viewMonth);
  const income=sumBy(mtx,'income'), expense=sumBy(mtx,'expense'), savings=income-expense;
  const reflected = activeSpace==='personal' ? mtx.filter(t=>t._shared).reduce((a,t)=>a+(+t.amount||0),0) : 0;

  // settle card (shared)
  if(activeSpace==='shared'){ const bal=settleBalance(sp); if(bal){
    const owe = bal.net>0.005, owed = bal.net<-0.005;
    h+=`<div class="card settle">
      <h3>🤝 Settle up</h3>
      ${Math.abs(bal.net)<0.01
        ? `<div class="big">All settled 🎉</div><div class="sub">You're even with ${bal.otherName}.</div>`
        : owe
          ? `<div class="big">${bal.otherName} owes you ${fmt(bal.net)}</div>`
          : `<div class="big">You owe ${bal.otherName} ${fmt(-bal.net)}</div>`}
      ${Math.abs(bal.net)>=0.01?`<button class="btn tonal mt8" onclick="openSettle()">Record a settle-up</button>`:''}
    </div>`;
  }}

  // summary tiles
  h+=`<div class="sum-grid">
    <div class="sum-tile income"><div class="lbl">Income</div><div class="val">${fmt0(income)}</div></div>
    <div class="sum-tile expense"><div class="lbl">Spent</div><div class="val">${fmt0(expense)}</div></div>
    <div class="sum-tile save"><div class="lbl">Saved</div><div class="val ${savings>=0?'pos':'neg'}">${savings<0?'-':''}${fmt0(savings)}</div></div>
  </div>`;
  if(reflected>0) h+=`<div class="sub" style="margin:-4px 2px 10px">🤝 Includes <b>${fmt0(reflected)}</b> — your share of Shared expenses this month.</div>`;

  // savings goal
  const goal=+sp.settings.savingsGoal||0;
  if(goal>0){
    const pct=Math.max(0,Math.min(100,(savings/goal)*100));
    h+=`<div class="card"><h3>🎯 Savings goal</h3>
      <div class="bar-row"><div class="top"><span class="amt"><b>${fmt(Math.max(0,savings))}</b> of ${fmt(goal)}</span>
        <span class="pill ${savings>=goal?'ok':'over'}">${Math.round(pct)}%</span></div>
        <div class="track"><div class="fill ${savings<0?'over':''}" style="width:${pct}%"></div></div></div>
    </div>`;
  }

  // 50/30/20
  h+=view503020(sp,mtx,income);

  // budget vs actual
  const exCats=(sp.categories||[]).filter(c=>c.type==='expense');
  const withTargets=exCats.filter(c=>effectiveTarget(sp,c,viewMonth)>0)
    .map(c=>({c,spent:spentByCat(mtx,c.id),tgt:effectiveTarget(sp,c,viewMonth)}))
    .sort((a,b)=> (b.spent/b.tgt)-(a.spent/a.tgt));
  h+=`<div class="card"><h3>📊 Budget vs actual</h3>`;
  if(!withTargets.length){
    h+=`<div class="sub">No category targets set yet. <a onclick="setTab('plan')" style="color:var(--primary);text-decoration:underline">Set some in Plan →</a></div>`;
  } else {
    withTargets.forEach(({c,spent,tgt})=>{
      const pct=Math.min(100,(spent/tgt)*100); const over=spent>tgt;
      h+=`<div class="bar-row"><div class="top"><span>${c.icon||'•'} ${c.name}</span>
        <span class="amt"><b>${fmt0(spent)}</b> / ${fmt0(tgt)}</span></div>
        <div class="track"><div class="fill ${over?'over':(pct>85?'warn':'')}" style="width:${pct}%"></div></div></div>`;
    });
  }
  h+=`</div>`;
  return h;
}

function view503020(sp,mtx,income){
  const base = income>0?income:sumBy(mtx,'expense');
  const g={need:0,want:0,savings:0};
  mtx.filter(t=>t.type==='expense').forEach(t=>{ const c=catById(sp,t.categoryId); const grp=t._group||(c&&c.group)||'want'; g[grp]=(g[grp]||0)+(+t.amount||0); });
  const spent=g.need+g.want; const saved=Math.max(0,income-spent);
  const tot=g.need+g.want+saved||1;
  const p=x=>Math.round((x/tot)*100);
  return `<div class="card"><h3>⚖️ 50 / 30 / 20</h3>
    <div class="tri">
      <span class="need" style="width:${(g.need/tot)*100}%"></span>
      <span class="want" style="width:${(g.want/tot)*100}%"></span>
      <span class="sav" style="width:${(saved/tot)*100}%"></span>
    </div>
    <div class="tri-legend">
      <span class="k"><span class="dot" style="background:var(--primary)"></span>Needs ${p(g.need)}% <span class="muted">/50</span></span>
      <span class="k"><span class="dot" style="background:var(--secondary)"></span>Wants ${p(g.want)}% <span class="muted">/30</span></span>
      <span class="k"><span class="dot" style="background:var(--tertiary)"></span>Savings ${p(saved)}% <span class="muted">/20</span></span>
    </div>
    <div class="sub mt8">${income>0?'Based on this month’s income.':'Add income this month to see your true split.'}</div>
  </div>`;
}

function monthNav(){
  return `<div class="month-nav">
    <button onclick="changeMonth(-1)">‹</button>
    <div class="label">${monthLabel(viewMonth)}</div>
    <button onclick="changeMonth(1)">›</button>
  </div>`;
}
function changeMonth(d){ const nd=parseYM(viewMonth); nd.setMonth(nd.getMonth()+d); viewMonth=ymKey(nd); render(); }

/* =====================================================================
   VIEW: TRANSACTIONS
   ===================================================================== */
let txFilter='all';
function viewTx(){
  const sp=curSpace();
  let h=monthNav();
  const mtx=effMonthTx(sp,viewMonth).slice().sort((a,b)=> (b.date||'').localeCompare(a.date||''));
  const filtered = txFilter==='all'?mtx : mtx.filter(t=>t.type===txFilter);
  h+=`<div class="chips mb8" style="margin:0 0 12px">
    ${['all','expense','income'].map(f=>`<button class="chip small ${txFilter===f?'active':''}" onclick="txFilter='${f}';render()">${f==='all'?'All':f==='expense'?'Expenses':'Income'}</button>`).join('')}
  </div>`;
  if(!filtered.length){ h+=`<div class="empty"><div class="em">🗒️</div>No transactions this month.<br>Tap ＋ to add one.</div>`; return h; }
  let lastDay='';
  filtered.forEach(t=>{
    const day=t.date;
    if(day!==lastDay){ lastDay=day; h+=`<div class="tx-day">${new Date(t.date+'T00:00').toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'})}</div>`; }
    const c = t._shared ? {icon:t.icon,name:t.name} : (catById(sp,t.categoryId)||{icon:'❓',name:'Uncategorized'});
    const isInc=t.type==='income';
    const isRec = !t._shared && !!t.recurringId;
    const tag = t._shared ? `<span class="tag">🤝 Shared</span>` : (isRec?`<span class="tag">🔁</span>`:'');
    const payer = activeSpace==='shared' ? paidByName(sp,t) : '';
    // Primary line = vendor (falls back to category); secondary = category (+ who paid, for shared)
    const primary = t._shared ? (t.vendor || 'Your share of a Shared expense') : (t.vendor || c.name);
    let secondary;
    if(t.vendor || t._shared){ secondary = c.name + (payer?` · ${payer}`:''); }
    else { secondary = t.note || payer || ''; }
    const click = t._shared ? `openReflected('${t.srcId}')` : `openEdit('${t.id}')`;
    h+=`<div class="tx ${isInc?'inc':''}${t._shared?' reflected':''}" onclick="${click}">
      <div class="ic">${c.icon||'•'}</div>
      <div class="mid"><div class="t1">${primary} ${tag}</div><div class="t2">${secondary}</div></div>
      <div class="amt ${isInc?'inc':''}">${isInc?'+':'-'}${fmt(t.amount)}</div>
    </div>`;
  });
  return h;
}
function paidByName(sp,t){ if(!t.paidBy) return ''; if(t.paidBy===user.uid) return 'You paid'; const m=sp.members[t.paidBy]; return (m&&m.name?m.name:'Partner')+' paid'; }
function openReflected(srcId){ toast('This is your share of a Shared expense — edit it on the Shared side.'); activeSpace='shared'; render(); if(srcId) openEdit(srcId); }

/* Safe arithmetic evaluator for the amount field. Understands + - × ÷ only
   (no eval, no parentheses). Multiply/divide bind tighter than add/subtract.
   Returns NaN on anything invalid; tolerates a trailing operator (uses the
   valid part, so a half-typed "12+" reads as 12). */
function evalExpr(str){
  if(str==null) return NaN;
  const s=String(str).replace(/[×✕xX]/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-').replace(/,/g,'.').replace(/\s+/g,'');
  if(!s) return NaN;
  if(!/^[0-9.+\-*/]+$/.test(s)) return NaN;
  const toks=[]; let num='';
  for(const ch of s){
    if('+-*/'.includes(ch)){
      if(num===''){ if(toks.length===0) return NaN; return NaN; } // leading/double operator
      toks.push(parseFloat(num)); num=''; toks.push(ch);
    } else num+=ch;
  }
  if(num!=='') toks.push(parseFloat(num)); else toks.pop();      // drop a trailing operator
  if(!toks.length || typeof toks[0]!=='number' || isNaN(toks[0])) return NaN;
  if(toks.some(t=>typeof t==='number' && isNaN(t))) return NaN;
  const p=[toks[0]];                                             // pass 1: * and /
  for(let i=1;i<toks.length;i+=2){
    const op=toks[i], b=toks[i+1];
    if(typeof b!=='number') break;
    if(op==='*') p[p.length-1]*=b;
    else if(op==='/') p[p.length-1] = b===0?NaN : p[p.length-1]/b;
    else p.push(op,b);
  }
  let res=p[0];                                                  // pass 2: + and -
  for(let i=1;i<p.length;i+=2){ const op=p[i],b=p[i+1]; if(op==='+')res+=b; else if(op==='-')res-=b; }
  return res;
}
function trimNum(n){ n=Math.round(n*100)/100; return String(n); }
function renderAmt(){
  const a=addDraft.amount||'';
  const el=document.getElementById('amtNum');
  if(el){ el.textContent=a||'0'; el.classList.toggle('expr', /[+\-*/]/.test(a) || a.length>9); }
  const pv=document.getElementById('amtPreview');
  if(pv){
    if(/[+\-*/]/.test(a)){ const r=evalExpr(a); pv.textContent = isFinite(r)? '= '+CUR_SYMBOL+trimNum(r) : ''; }
    else pv.textContent='';
  }
  updateSplitHint();
}
function keyPress(k){
  let a=addDraft.amount||'';
  const isOp=c=>'+-*/'.includes(c);
  if(k==='⌫'){ a=a.slice(0,-1); }
  else if(k==='C'){ a=''; }
  else if(k==='='){ const r=evalExpr(a); if(isFinite(r)) a=trimNum(r); }
  else if('÷×−+-*/'.includes(k)){
    const op = k==='÷'?'/' : k==='×'?'*' : k==='−'?'-' : k;
    if(a==='') return;                              // no leading operator
    a = isOp(a[a.length-1]) ? a.slice(0,-1)+op : a+op;   // replace a trailing operator
  }
  else if(k==='.'){
    const seg=a.split(/[+\-*/]/).pop();
    if(seg.includes('.')) return;                  // one decimal per number
    a = (a===''||isOp(a[a.length-1])) ? a+'0.' : a+'.';
  }
  else {                                           // a digit
    if(a==='0') a='';
    const seg=a.split(/[+\-*/]/).pop();
    if(seg.includes('.') && seg.split('.')[1].length>=2) return; // max 2 decimals per number
    a=a+k;
  }
  addDraft.amount=a; renderAmt();
}
function saveTx(){
  const d=addDraft; const amt=evalExpr(d.amount);
  if(!isFinite(amt)||amt<=0){ toast('Enter a valid amount'); return; }
  if(!d.categoryId){ toast('Pick a category'); return; }
  if(!d.id && d.type==='expense' && !(d.vendor||'').trim()){ toast('Add a store / vendor'); return; }  // required on new adds only, not edits
  if(d._saving) return;                 // guard: ignore a second Save tap on the same entry
  d._saving=true;
  const sp=draftSpace(); const amtR=Math.round(amt*100)/100;
  const isSharedExp = d.space==='shared' && d.type==='expense';
  closeSheet();                         // close now so there is nothing left to double-tap

  // Recurring: create a rule (only on a fresh add), then generate occurrences.
  if(!d.id && d.repeat && d.repeat!=='none'){
    const rule={id:uid(), freq:d.repeat, anchor:d.date, amount:amtR, categoryId:d.categoryId,
      vendor:d.vendor.trim(), note:d.note.trim(), type:d.type, active:true, lastGen:null};
    if(isSharedExp){ rule.paidBy=d.paidBy; rule.splitType=d.splitType; rule.customMine=d.customMine; rule.customPct=d.customPct; }
    sp.recurring=asArray(sp.recurring); sp.recurring.push(rule);
    runRecurring(sp); // generates + saves
    render();
    toast('Recurring '+d.type+' added');
    return;
  }

  const t={id:d.id||uid(), date:d.date, amount:amtR, categoryId:d.categoryId, vendor:d.vendor.trim(), note:d.note.trim(), type:d.type};
  if(isSharedExp){
    t.paidBy=d.paidBy;
    t.split=computeSplit(sp,amtR,d.paidBy,d.splitType,d.customMine,d.customPct);
  }
  sp.transactions=asArray(sp.transactions);
  if(d.id){ const i=sp.transactions.findIndex(x=>x.id===d.id); if(i>=0){ t.recurringId=sp.transactions[i].recurringId; t.occ=sp.transactions[i].occ; sp.transactions[i]=t; } }
  else sp.transactions.push(t);
  saveSpace(d.space); render();
  toast(d.id?'Updated':'Added '+fmt(amt));
}

  const sp=draftSpace(); sp.transactions=asArray(sp.transactions).filter(t=>t.id!==id);
  saveSpace(addDraft.space); closeSheet(); render(); toast('Deleted');

  const youOwe = bal.net<0; const amt=Math.abs(bal.net);
  const html=`<div class="grabber"></div><h2>Record a settle-up</h2>
    <p class="muted">${youOwe?`You pay ${bal.otherName}`:`${bal.otherName} pays you`} <b>${fmt(amt)}</b> to even out.</p>
    <div class="field"><label>Amount</label><div class="flex"><span class="muted">${CUR_SYMBOL}</span><input id="settleAmt" class="input" type="number" inputmode="decimal" value="${amt.toFixed(2)}"></div></div>
    <button class="btn filled block" onclick="recordSettle(${youOwe})">Mark as paid</button>`;
  openSheetHTML(html);
}
function recordSettle(youOwe){
  const sp=curSpace(); const bal=settleBalance(sp);
  const amt=parseFloat(document.getElementById('settleAmt').value)||0; if(amt<=0){toast('Enter amount');return;}
  sp.settlements=asArray(sp.settlements);
  sp.settlements.push({id:uid(),date:todayStr(),
    from: youOwe?user.uid:bal.other, to: youOwe?bal.other:user.uid, amount:amt});
  saveSpace('shared'); closeSheet(); render(); toast('Settled '+fmt(amt));
}

/* =====================================================================
   SHEET plumbing
   ===================================================================== */
function openSheetHTML(html){ const s=document.getElementById('sheet'); s.style.transition=''; s.style.transform=''; s.scrollTop=0; s.innerHTML=html; s.classList.add('show'); document.getElementById('scrim').classList.add('show'); }
function closeSheet(){ const s=document.getElementById('sheet'); s.style.transition=''; s.style.transform=''; s.classList.remove('show'); const sc=document.getElementById('scrim'); sc.style.opacity=''; sc.classList.remove('show'); }

/* Phone back-gesture handling: a swipe-back first closes any open sheet
   (the add/edit "text boxes", settings, backups, etc.); if nothing is open
   it returns to the Home tab — instead of closing the whole app. We keep one
   dummy history entry ("guard") on top while the app is open and re-add it
   after each back, so the gesture is always caught. To leave the app, use the
   phone's Home button / app switcher. */
let _guardsUp=false;
function armNavGuard(){
  if(_guardsUp) return;
  // Keep TWO dummy entries so a single back never reaches the app's start URL —
  // some Android gesture handlers minimise the app the moment it does.
  try{ history.pushState({nest:1},''); history.pushState({nest:2},''); }catch(e){}
  _guardsUp=true;
}
function initBackButton(){
  window.addEventListener('popstate', ()=>{
    const appEl=document.getElementById('app');
    if(!appEl || appEl.classList.contains('hidden')){ _guardsUp=false; return; } // before sign-in: back behaves normally
    try{ history.pushState({nest:2},''); }catch(e){}   // restore the entry this back just consumed
    _guardsUp=true;
    const sheet=document.getElementById('sheet');
    if(sheet && sheet.classList.contains('show')){ closeSheet(); return; }   // 1) close an open sheet
    if(activeTab!=='home'){ setTab('home'); return; }                        // 2) jump to Home
    // 3) home & nothing open → do nothing (stay in the app)
  });
}

/* Drag-to-dismiss for the bottom sheet (mobile). The sheet follows your finger
   as you drag down and only closes past a threshold — otherwise it snaps back,
   so a small accidental swipe won't dismiss it. */
function initSheetGesture(){
  const sheet=document.getElementById('sheet'); const scrim=document.getElementById('scrim');
  if(!sheet) return;
  const DISMISS=110;            // px dragged before it closes
  let startY=0, curY=0, candidate=false, dragging=false;
  const start=(y,target)=>{
    dragging=false;
    // start a drag only from the grabber/header, or when the sheet is scrolled to the top
    const fromHandle = target && target.closest && target.closest('.grabber, h2, .between, .type-toggle');
    candidate = !!fromHandle || sheet.scrollTop<=0;
    startY=y; curY=y;
  };
  const move=(y,ev)=>{
    if(!candidate) return;
    const dy=y-startY;
    if(!dragging){
      if(dy>6){ dragging=true; sheet.style.transition='none'; }   // downward intent -> begin drag
      else if(dy<-2){ candidate=false; return; }                  // moving up -> let content scroll
      else return;
    }
    curY=y;
    if(dy<=0){ sheet.style.transform='translateY(0)'; if(scrim) scrim.style.opacity=''; return; }
    if(ev && ev.cancelable) ev.preventDefault();                  // stop content scrolling while dragging
    sheet.style.transform='translateY('+dy+'px)';
    const h=sheet.offsetHeight||600;
    if(scrim) scrim.style.opacity=String(Math.max(0,1-dy/h));
  };
  const end=()=>{
    if(!candidate) return;
    candidate=false;
    const dy=curY-startY;
    sheet.style.transition='';                                    // restore the CSS ease
    if(scrim) scrim.style.opacity='';
    sheet.style.transform='';                                     // back to the .show position (or out, if closing)
    if(dragging && dy>DISMISS) closeSheet();
    dragging=false;
  };
  sheet.addEventListener('touchstart', e=>start(e.touches[0].clientY, e.target), {passive:true});
  sheet.addEventListener('touchmove',  e=>move(e.touches[0].clientY, e), {passive:false});
  sheet.addEventListener('touchend',   end);
  sheet.addEventListener('touchcancel',end);
}

/* Physical-keyboard entry for the amount while the Add/Edit sheet is open
   (mainly for desktop — type on the number pad instead of clicking the keypad).
   Number keys route to the on-screen keypad's keyPress; typing in the real
   text fields (vendor / note / date / split) is left alone. */
function initAmountKeyboard(){
  document.addEventListener('keydown', e=>{
    const sheet=document.getElementById('sheet');
    if(!sheet || !sheet.classList.contains('show')) return;
    if(!document.getElementById('amtNum')) return;         // only the Add/Edit sheet has the amount pad
    if(e.ctrlKey||e.metaKey||e.altKey) return;             // don't clobber shortcuts
    const k=e.key;
    if(k==='Escape'){ e.preventDefault(); closeSheet(); return; }
    const ae=document.activeElement;
    if(ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT')) return; // let real fields type
    if(k>='0' && k<='9'){ e.preventDefault(); keyPress(k); }
    else if(k==='.'||k===','){ e.preventDefault(); keyPress('.'); }
    else if(k==='+'||k==='-'||k==='*'||k==='/'){ e.preventDefault(); keyPress(k); }   // math operators
    else if(k==='x'||k==='X'){ e.preventDefault(); keyPress('*'); }                    // x = multiply
    else if(k==='='){ e.preventDefault(); keyPress('='); }                             // evaluate in place
    else if(k==='Backspace'||k==='Delete'){ e.preventDefault(); keyPress('⌫'); }
    else if(k==='Enter'){ e.preventDefault(); saveTx(); }
  });
}
