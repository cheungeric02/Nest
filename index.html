// Home "on pace" card: one continuous bar bridging what's banked, what's still
// coming, and what's left to spend → projected net saved for the month.
function onPaceCard(savings, expectedIncome, remainingBudget){
  const netSoFar = Math.round(savings*100)/100;
  const inc      = Math.round((expectedIncome||0)*100)/100;
  const spend    = Math.round((remainingBudget||0)*100)/100;
  const projNet  = Math.round((netSoFar + inc - spend)*100)/100;

  const netPos = Math.max(0, netSoFar);           // solid-green length (loss shown in list only)
  const pool   = netPos + inc;                     // total money in play
  const scale  = Math.max(pool, spend, 1);
  const pct    = v => Math.max(0, Math.min(100, (v/scale)*100));
  const netW   = pct(netPos), incW = pct(inc), spendW = pct(Math.min(spend, scale));
  const keepW  = Math.max(0, Math.min(100, (projNet/scale)*100));

  const t=new Date();
  const dim=new Date(t.getFullYear(), t.getMonth()+1, 0).getDate();
  const monLbl=t.toLocaleString('en-US',{month:'short'});

  const good = projNet>0.5;
  const heroCls = good ? '' : (projNet<-0.5 ? 'neg' : 'muted');
  const cap = good ? 'projected net saved this month'
            : (projNet<-0.5 ? 'projected shortfall this month'
                            : 'on pace to use your full budget');

  let bar = `<div class="pace-bar">`;
  if(netW>0.3) bar+=`<div class="seg s-net" style="width:${netW.toFixed(1)}%"></div>`;
  if(incW>0.3) bar+=`<div class="seg s-inc" style="width:${incW.toFixed(1)}%"></div>`;
  if(spendW>0.3) bar+=`<div class="s-spend" style="width:${spendW.toFixed(1)}%"></div>`;
  if(spend>0.5 && projNet>0.5 && keepW>1 && keepW<99) bar+=`<div class="divider" style="left:${keepW.toFixed(1)}%"></div>`;
  bar+=`</div>`;

  let brk='';
  if(spend>0.5 && projNet>0.5){
    brk=`<div class="pace-brk">
      <div class="keep" style="width:${keepW.toFixed(1)}%"><span class="k">keep · </span><b>${fmt0(projNet)}</b></div>
      <div class="spend-lbl" style="width:${(100-keepW).toFixed(1)}%"><span class="k">to spend · ${fmt0(spend)}</span></div>
    </div>`;
  }

  let list=`<div class="pace-list">`;
  list+=`<div class="pace-li"><span class="nm"><span class="pace-dot net"></span>Net saved so far</span><span class="v ${netSoFar<0?'neg':'pos'}">${netSoFar<0?'−':'+'}${fmt0(netSoFar)}</span></div>`;
  if(inc>0.5)   list+=`<div class="pace-li"><span class="nm"><span class="pace-dot inc"></span>Income still to come</span><span class="v pos">+${fmt0(inc)}</span></div>`;
  if(spend>0.5) list+=`<div class="pace-li"><span class="nm"><span class="pace-dot spend"></span>Budget left to spend</span><span class="v neg">−${fmt0(spend)}</span></div>`;
  list+=`<div class="pace-li tot"><span class="nm">Projected net saved</span><span class="v ${projNet<0?'neg':''}">${projNet<0?'−':''}${fmt0(projNet)}</span></div>`;
  list+=`</div>`;

  return `<div class="card pace">
    <div class="head2">
      <div>
        <div class="hero ${heroCls}">${projNet<0?'−':''}${fmt0(projNet)}</div>
        <div class="cap">${cap}</div>
      </div>
      <div class="month">${monLbl} · day ${t.getDate()}<br>of ${dim}</div>
    </div>
    ${bar}${brk}${list}
  </div>`;
}

// Home "on pace" card for the SHARED space: purely spend-vs-budget tracking —
// no income, no savings, so never a "shortfall". Projects month-end spend at
// the current daily pace and compares it to the month's total budget.
function spendPaceCard(spent, budget){
  spent  = Math.round((spent||0)*100)/100;
  budget = Math.round((budget||0)*100)/100;

  const t=new Date();
  const dim=new Date(t.getFullYear(), t.getMonth()+1, 0).getDate();
  const day=t.getDate();
  const monLbl=t.toLocaleString('en-US',{month:'short'});
  const frac=Math.min(1, day/dim);
  const proj=frac>0 ? Math.round((spent/frac)*100)/100 : spent;

  const projExtra=Math.max(0, Math.round((proj-spent)*100)/100);   // still to come at this pace
  const scale=Math.max(budget, proj, 1);
  const pct=v=>Math.max(0, Math.min(100, (v/scale)*100));
  const spentW=pct(spent), extraW=pct(projExtra), budgetW=pct(budget);

  const over=Math.round((proj-budget)*100)/100;
  const heroCls = over>0.5 ? 'neg' : (over<-0.5 ? '' : 'muted');
  const cap = over>0.5 ? 'projected to go over budget'
            : (over<-0.5 ? 'projected spend this month'
                         : 'on pace to use your full budget');

  let bar=`<div class="pace-bar">`;
  if(spentW>0.3) bar+=`<div class="seg s-net" style="width:${spentW.toFixed(1)}%"></div>`;
  if(extraW>0.3) bar+=`<div class="seg s-inc" style="width:${extraW.toFixed(1)}%"></div>`;
  if(budgetW>1 && budgetW<99) bar+=`<div class="divider" style="left:${budgetW.toFixed(1)}%"></div>`;
  bar+=`</div>`;

  const remaining=Math.round((budget-spent)*100)/100;
  let list=`<div class="pace-list">`;
  list+=`<div class="pace-li"><span class="nm"><span class="pace-dot net"></span>Spent so far</span><span class="v">${fmt0(spent)}</span></div>`;
  if(projExtra>0.5) list+=`<div class="pace-li"><span class="nm"><span class="pace-dot inc"></span>Still to come at this pace</span><span class="v">+${fmt0(projExtra)}</span></div>`;
  list+=`<div class="pace-li"><span class="nm"><span class="pace-dot spend"></span>${remaining>=0?'Budget left to spend':'Over budget by'}</span><span class="v ${remaining<0?'neg':'pos'}">${remaining<0?'−':''}${fmt0(Math.abs(remaining))}</span></div>`;
  list+=`<div class="pace-li tot"><span class="nm">Projected month-end spend</span><span class="v ${over>0.5?'neg':''}">${fmt0(proj)}</span></div>`;
  list+=`</div>`;

  return `<div class="card pace">
    <div class="head2">
      <div>
        <div class="hero ${heroCls}">${fmt0(proj)}</div>
        <div class="cap">${cap}</div>
      </div>
      <div class="month">${monLbl} · day ${day}<br>of ${dim}</div>
    </div>
    ${bar}${list}
  </div>`;
}

// distinct, theme-safe slice colors (mid-tones legible on light + dark)
const PIE_COLORS=['#3a6b4f','#e08a3c','#5a7fb0','#9b6bb0','#d1657a','#4fa08f','#b0894f','#7a9a3f','#c86b9e','#5b8c6e','#6b7bd1','#cf8a5a'];
// Donut of how total income splits across category budgets + savings goal (+ unallocated).
// Percentages are of total monthly income (paycheque-based when set), i.e. current + upcoming pay.
function planPieChart(sp, income){
  const goal=+sp.settings.savingsGoal||0;
  const segs=[];
  (sp.categories||[]).filter(c=>c.type==='expense').forEach(c=>{
    const t=effectiveTarget(sp,c,viewMonth);
    if(t>0.005) segs.push({name:c.name, icon:c.icon||'•', val:t});
  });
  segs.sort((a,b)=> b.val-a.val); // biggest share first (matches the budget list order)
  if(goal>0.005) segs.push({name:'Savings goal', icon:'🎯', val:goal});
  if(!segs.length) return `<div class="sub">Set category budgets or a savings goal to see how it splits.</div>`;
  segs.forEach((s,i)=>{ s.color = PIE_COLORS[i%PIE_COLORS.length]; });

  const alloc=segs.reduce((a,s)=>a+s.val,0);
  const free = income>alloc+0.005 ? income-alloc : 0;
  if(free>0) segs.push({name:'Unallocated', icon:'🫙', val:free, color:'var(--outline-variant)', free:true});
  const whole=Math.max(income,alloc)||alloc;   // circle represents the larger of income / total budgeted
  const overAlloc = alloc>income+0.005 && income>0;

  // donut via stroke-dash arcs
  const cx=90,cy=90,r=62,sw=30,C=2*Math.PI*r;
  let acc=0, arcs='';
  segs.forEach(s=>{
    const frac=s.val/whole, len=frac*C;
    arcs+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${s.color}" stroke-width="${sw}" stroke-dasharray="${len.toFixed(2)} ${(C-len).toFixed(2)}" stroke-dashoffset="${(-acc*C).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})"/>`;
    acc+=frac;
  });
  const centerTop = income>0 ? fmt0(income) : fmt0(alloc);
  const centerBot = income>0 ? 'income/mo' : 'budgeted';
  const donut=`<svg class="pie-svg" viewBox="0 0 180 180" role="img" aria-label="How your income splits across budgets">
    ${arcs}
    <text x="${cx}" y="${cy-3}" text-anchor="middle" font-size="20" font-weight="800" fill="var(--on-surface)">${centerTop}</text>
    <text x="${cx}" y="${cy+15}" text-anchor="middle" font-size="10" fill="var(--on-surface-variant)">${centerBot}</text>
  </svg>`;

  const denom = income>0 ? income : alloc;
  const legend=segs.map(s=>{
    const pc = denom>0 ? Math.round(s.val/denom*100) : 0;
    return `<div class="row"><span class="sw" style="background:${s.color}"></span>
      <span class="nm">${s.icon} ${s.name}</span>
      <span class="pc">${pc}%</span><span class="am">${fmt0(s.val)}</span></div>`;
  }).join('');

  const note = overAlloc
    ? `<div class="sub" style="margin-top:4px;color:var(--error)">⚠️ Your budgets + savings goal total ${fmt0(alloc)} — that's ${Math.round(alloc/income*100)}% of your ${fmt0(income)} income. Trim somewhere to stay within 100%.</div>`
    : (income<=0 && activeSpace!=='shared') ? `<div class="sub" style="margin-top:4px">Add your income above to see each slice as a % of income.</div>` : '';

  return `<div class="pie-wrap">${donut}<div class="pie-legend">${legend}</div></div>${note}`;
}

function setPaycheck(v){ curSpace().settings.paycheck=+v||0; saveSpace(activeSpace); render(); toast('Income updated'); }

// pick a "nice" gridline step for a value range
function niceStep(range,ticks){
  const raw=Math.max(1e-9,range)/Math.max(1,ticks);
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));
  const n=raw/mag; let s = n<1.5?1 : n<3?2 : n<7?5 : 10;
  return s*mag;
}
// compact money label for a bar cap, e.g. $5.0k, $906, ($906)
function abbrMoney(v){
  const a=Math.abs(v); let s = a>=1000 ? CUR_SYMBOL+(a/1000).toFixed(a>=10000?0:1)+'k' : CUR_SYMBOL+Math.round(a).toLocaleString('en-CA');
  return v<0 ? '('+s+')' : s;
}
// Income / Expenses / Savings — this month vs monthly average. Green income, red expenses,
// savings green/red by sign; the "this month" bar is solid, the average bar is faded.
function insightsSummaryChart(sp){
  const cur=viewMonth;
  const curInc=sumBy(effMonthTx(sp,cur),'income'), curExp=sumBy(effMonthTx(sp,cur),'expense');
  const prior=monthsSpan(sp).filter(m=>m!==cur)
    .map(m=>({inc:sumBy(effMonthTx(sp,m),'income'), exp:sumBy(effMonthTx(sp,m),'expense')}))
    .filter(d=>d.inc>0||d.exp>0);
  const hasAvg=prior.length>0;
  const mean=k=>prior.reduce((a,d)=>a+d[k],0)/prior.length;
  const avgInc=hasAvg?mean('inc'):0, avgExp=hasAvg?mean('exp'):0;
  if(!hasAvg && curInc===0 && curExp===0)
    return `<div class="sub">Add some income and expenses to see this month at a glance.</div>`;

  const G=[
    {label:'Income',   color:'var(--success)', now:curInc,        avg:avgInc},
    {label:'Expenses', color:'var(--error)',   now:curExp,        avg:avgExp},
    {label:'Savings',  savings:true,           now:curInc-curExp, avg:avgInc-avgExp}
  ];
  const vals=[]; G.forEach(g=>{ vals.push(g.now); if(hasAvg) vals.push(g.avg); });
  const step=niceStep((Math.max(0,...vals)-Math.min(0,...vals))||1, 4);
  let top=Math.ceil(Math.max(0,...vals)/step)*step, bot=Math.floor(Math.min(0,...vals)/step)*step;
  if(top===bot) top=step;

  const W=340,H=250, mL=48,mR=12,mT=20,mB=44;
  const pL=mL,pR=W-mR,pT=mT,pB=H-mB, pH=pB-pT, pW=pR-pL;
  const y=v=> pT + (top-v)/(top-bot)*pH;
  const zeroY=y(0), col=g=> g.savings ? (g.now>=0?'var(--success)':'var(--error)') : g.color;

  // gridlines + axis labels
  let grid='';
  for(let v=bot; v<=top+1e-6; v+=step){
    const yy=y(v).toFixed(1), zero=Math.abs(v)<1e-6;
    grid+=`<line x1="${pL}" y1="${yy}" x2="${pR}" y2="${yy}" stroke="var(--outline-variant)" stroke-width="${zero?1.4:1}" ${zero?'':'stroke-dasharray="2 3"'} opacity="${zero?0.9:0.45}"/>`
       +  `<text x="${pL-6}" y="${(+yy+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--on-surface-variant)">${v<0?'-':''}${fmt0(v)}</text>`;
  }

  // grouped bars
  const gw=pW/G.length, bw=hasAvg?26:40, ig=8, total=hasAvg?bw*2+ig:bw;
  let bars='';
  G.forEach((g,i)=>{
    const cx=pL+gw*i+gw/2, color=col(g);
    const series=hasAvg?[{v:g.now,solid:true},{v:g.avg,solid:false}]:[{v:g.now,solid:true}];
    series.forEach((s,si)=>{
      const bx=cx-total/2+si*(bw+ig);
      const yv=y(s.v), pos=s.v>=0;
      const ry=pos?yv:zeroY, rh=Math.max(0.5,Math.abs(zeroY-yv));
      const savColor = g.savings ? (s.v>=0?'var(--success)':'var(--error)') : color;
      bars+=`<rect x="${bx.toFixed(1)}" y="${ry.toFixed(1)}" width="${bw}" height="${rh.toFixed(1)}" rx="3" fill="${savColor}" fill-opacity="${s.solid?1:0.4}"/>`
         +  `<text x="${(bx+bw/2).toFixed(1)}" y="${(pos?yv-4:yv+11).toFixed(1)}" text-anchor="middle" font-size="8.5" font-weight="${s.solid?700:500}" fill="var(--on-surface)">${abbrMoney(s.v)}</text>`;
    });
    bars+=`<text x="${cx.toFixed(1)}" y="${pB+16}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--on-surface)">${g.label}</text>`;
  });

  const svg=`<svg class="cmp-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Income, expenses and savings this month versus the monthly average">${grid}${bars}</svg>`;
  const caption = hasAvg
    ? `<div class="cmp-caption"><span class="k"><span class="sw" style="background:var(--on-surface)"></span>${monthLabel(cur).replace(/ \d{4}$/,'')} (this month)</span><span class="k"><span class="sw" style="background:var(--on-surface);opacity:.4"></span>Monthly average</span></div>`
    : `<div class="sub">Showing this month. A monthly-average bar appears once you have earlier months to compare.</div>`;
  return svg+caption;
}
// Compact 6-month trend — same green income / red expense palette, smaller than the at-a-glance chart.
function insightsTrendChart(rows){
  const vals=[]; rows.forEach(r=>{ vals.push(r.inc, r.exp); });
  const maxV=Math.max(0,...vals);
  if(maxV<=0) return `<div class="sub">No activity yet in the last 6 months.</div>`;
  const step=niceStep(maxV||1,3);
  const top=Math.max(step,Math.ceil(maxV/step)*step);
  const W=340,H=150, mL=38,mR=8,mT=10,mB=22;
  const pL=mL,pR=W-mR,pT=mT,pB=H-mB, pH=pB-pT, pW=pR-pL;
  const y=v=> pT + (top-v)/top*pH;
  let grid='';
  for(let v=0; v<=top+1e-6; v+=step){
    const yy=y(v).toFixed(1), zero=v<1e-6;
    grid+=`<line x1="${pL}" y1="${yy}" x2="${pR}" y2="${yy}" stroke="var(--outline-variant)" stroke-width="${zero?1.3:1}" ${zero?'':'stroke-dasharray="2 3"'} opacity="${zero?0.9:0.4}"/>`
       +  `<text x="${pL-5}" y="${(+yy+3).toFixed(1)}" text-anchor="end" font-size="8" fill="var(--on-surface-variant)">${fmt0(v)}</text>`;
  }
  const gw=pW/rows.length, bw=9, ig=3, total=bw*2+ig;
  let bars='';
  rows.forEach((r,i)=>{
    const cx=pL+gw*i+gw/2;
    [{v:r.inc,c:'var(--success)'},{v:r.exp,c:'var(--error)'}].forEach((s,si)=>{
      const bx=cx-total/2+si*(bw+ig), yv=y(s.v), rh=Math.max(0.5,pB-yv);
      bars+=`<rect x="${bx.toFixed(1)}" y="${yv.toFixed(1)}" width="${bw}" height="${rh.toFixed(1)}" rx="2.5" fill="${s.c}"/>`;
    });
    bars+=`<text x="${cx.toFixed(1)}" y="${pB+14}" text-anchor="middle" font-size="9" fill="var(--on-surface-variant)">${parseYM(r.m).toLocaleDateString('en-CA',{month:'short'})}</text>`;
  });
  return `<svg class="cmp-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Income and expenses over the last six months">${grid}${bars}</svg>`;
}

// Savings pools — running sinking funds shown "as of now", not scoped to the viewed month.
// Compact Home line(s) for goal pools — quiet, no nag: name, progress bar, % and one status word.
function homeGoalCards(sp){
  const goals=(sp.categories||[]).filter(c=>c.type==='expense'&&c.pool&&(+c.poolTarget||0)>0);
  if(!goals.length) return '';
  return goals.map(c=>{
    const s=poolStats(sp,c);
    let right, cls='';
    if(s.reached){ right='🎉 reached'; cls='ok'; }
    else if(s.goalDate && s.onTrack){ right=`on track · ${monthLabel(s.goalDate)}`; cls='ok'; }
    else if(s.goalDate && s.onTrack===false){ right=`behind · ~${s.etaYM?monthLabel(s.etaYM):'—'}`; cls='warn'; }
    else if(s.etaYM){ right=`~${monthLabel(s.etaYM)}`; }
    else right='';
    return `<div class="card goal-mini">
      <div class="gm-head"><span class="gm-nm">${c.icon||'🎯'} ${c.name}</span><span class="gm-pct">${Math.round(s.goalPct)}%</span></div>
      <div class="gm-bar"><div class="gm-fill" style="width:${s.goalPct.toFixed(1)}%"></div></div>
      <div class="gm-meta"><span>${fmt0(s.balance)} of ${fmt0(s.goal)}${s.reached?'':' · '+fmt0(s.toGo)+' to go'}</span><span class="${cls}">${right}</span></div>
    </div>`;
  }).join('');
}
function poolsCard(sp){
  const pools=(sp.categories||[]).filter(c=>c.type==='expense'&&c.pool);
  if(!pools.length) return '';
  let h=`<div class="card"><h3>🏦 Savings pools</h3>
    <div class="sub mb8">Sinking funds you build over time — set aside monthly, spend whenever. Balances carry across months and years.</div>`;
  pools.forEach(c=>{
    const s=poolStats(sp,c);
    if(s.goal>0){
      // goal pool (e.g. house down payment): progress toward a target + ETA
      const st = s.reached ? 'ok' : (s.onTrack===false ? 'warn' : 'ok');
      let status;
      if(s.reached) status=`🎉 Goal reached!`;
      else if(s.goalDate && s.onTrack) status=`🟢 On track for ${monthLabel(s.goalDate)}`;
      else if(s.goalDate && s.onTrack===false) status=`🟠 ~${s.etaYM?monthLabel(s.etaYM):'—'} at ${fmt0(s.setAside)}/mo · ${fmt0(s.reqPerMo)}/mo to hit ${monthLabel(s.goalDate)}`;
      else if(s.etaYM) status=`On pace to reach it by ${monthLabel(s.etaYM)} at ${fmt0(s.setAside)}/mo`;
      else status=`Set a monthly amount in Plan to see an ETA`;
      h+=`<div class="pool-row">
        <div class="pool-head">
          <span class="pool-nm">${c.icon||'•'} ${c.name}</span>
          <span class="pool-bal">${fmt0(s.balance)}</span>
        </div>
        <div class="pool-goalbar"><div class="pool-goalfill" style="width:${s.goalPct.toFixed(1)}%"></div></div>
        <div class="pool-meta">
          <span>${fmt0(s.balance)} of ${fmt0(s.goal)} · ${Math.round(s.goalPct)}%</span>
          <span>${s.reached?'0 to go':fmt0(s.toGo)+' to go'}</span>
        </div>
        <div class="pool-status ${st}">${status}</div>
      </div>`;
      return;
    }
    const over=s.balance<-0.005;
    const spentPct=s.accrued>0?Math.max(0,Math.min(100,(s.spent/s.accrued)*100)):(s.spent>0?100:0);
    h+=`<div class="pool-row">
      <div class="pool-head">
        <span class="pool-nm">${c.icon||'•'} ${c.name}</span>
        <span class="pool-bal ${over?'neg':''}">${over?'−':''}${fmt0(s.balance)}</span>
      </div>
      <div class="pool-track ${over?'over':''}"><div class="pool-spent" style="width:${spentPct.toFixed(1)}%"></div></div>
      <div class="pool-meta">
        <span>${fmt0(s.setAside)}/mo set aside</span>
        <span>${fmt0(s.spent)} spent of ${fmt0(s.accrued)}</span>
      </div>
    </div>`;
  });
  h+=`</div>`;
  return h;
}
function viewInsights(){
  const sp=curSpace();
  const months=monthsSpan(sp);
  const rows=months.map(m=>({m,inc:sumBy(effMonthTx(sp,m),'income'),exp:sumBy(effMonthTx(sp,m),'expense')}));
  let h=`<div class="card"><h3>📊 ${monthLabel(viewMonth)} at a glance</h3>
    ${insightsSummaryChart(sp)}
  </div>`;
  h+=`<div class="card"><h3>📈 Last 6 months</h3>
    ${insightsTrendChart(rows)}
    <div class="tri-legend mt8"><span class="k"><span class="dot" style="background:var(--success)"></span>Income</span><span class="k"><span class="dot" style="background:var(--error)"></span>Expenses</span></div>
  </div>`;

  h+=poolsCard(sp);

  // category breakdown — actual expenses by category over the selected period.
  const iwin=insWindow();
  const imulti=iwin.n>1;
  const byCat={};
  iwin.months.forEach(ym=>{
    effMonthTx(sp,ym).filter(t=>t.type==='expense').forEach(t=>{
      const key=t.categoryId||('_'+(t.name||'Shared')); byCat[key]=(byCat[key]||0)+(+t.amount||0);
    });
  });
  const arr=Object.entries(byCat).map(([id,v])=>({c:catById(sp,id)||{name:'Shared',icon:'🤝'},v})).sort((a,b)=>b.v-a.v);
  const totReal=arr.reduce((a,x)=>a+x.v,0), totExp=totReal||1;
  const iTitle = imulti ? 'Where it went' : `${monthLabel(viewMonth)} — where it went`;
  h+=`<div class="card"><h3>🧁 ${iTitle}</h3>`;
  h+=insChips();
  if(imulti){
    const rng = iwin.start===iwin.end ? monthLabel(iwin.start)
      : `${parseYM(iwin.start).toLocaleDateString('en-CA',{month:'short',year:'numeric'})} – ${parseYM(iwin.end).toLocaleDateString('en-CA',{month:'short',year:'numeric'})}`;
    h+=`<div class="sub mb8">${rng} · ${iwin.n} months · <b>${fmt0(totReal)}</b> spent</div>`;
  }
  if(!arr.length) h+=`<div class="sub">No expenses in this period.</div>`;
  else arr.forEach(({c,v})=>{
    const pct=(v/totExp)*100;
    const avg = imulti?` <span class="muted" style="font-weight:400">· ${fmt0(v/iwin.n)}/mo</span>`:'';
    h+=`<div class="bar-row"><div class="top"><span>${c.icon||'•'} ${c.name}</span><span class="amt"><b>${fmt0(v)}</b> · ${Math.round(pct)}%${avg}</span></div>
      <div class="track"><div class="fill" style="width:${pct}%"></div></div></div>`;
  });
  h+=`</div>`;
  return h;
}

function makeCode(){ return Math.random().toString(36).slice(2,7).toUpperCase(); }
function createShared(){
  const sp=blankSpace(); sp.categories=buildDefaultCats(); sp.settings.savingsGoal=0;
  sp.members[user.uid]={name:user.name}; sp.inviteCode=makeCode();

function joinShared(code){
  code=(code||'').trim().toUpperCase();
  if(TEST_MODE){
    const s=JSON.parse(localStorage.getItem('nest_shared')||'null');
    if(s&&s.inviteCode===code){ s.members[user.uid]={name:user.name}; data.shared=normalizeSpace(s); data.shared.id='shared'; saveSpace('shared'); closeSheet(); render(); toast('Joined shared space'); }
    else toast('No space with that code (test)');
    return;
  }
  // firebase: find space by scanning is expensive; store codes map
  db.ref('inviteCodes/'+code).get().then(snap=>{
    const sid=snap.val();
    if(!sid){ toast('Invalid code'); return; }
    db.ref('shared/'+sid+'/members/'+user.uid).set({name:user.name});
    db.ref('users/'+user.uid+'/sharedSpace').set(sid);
    closeSheet(); attachShared(sid); render(); toast('Joined!');
  });
}

// default date for a new entry: today when you're on the current month, otherwise
// drop into the month you're actually viewing (so adding while browsing August lands in August)
function defaultAddDate(){
  const nowYM=ymKey(new Date());
  if(viewMonth===nowYM) return todayStr();
  const today=new Date();
  const [y,m]=viewMonth.split('-').map(Number);
  const day=Math.min(today.getDate(), daysInMonth(y, m-1));   // keep today's day-of-month, clamped to that month
  return viewMonth+'-'+String(day).padStart(2,'0');
}

  if(d.type==='income') d.space=(isEdit||isRec)?d.space:activeSpace;  // income follows the space you're in
  const sp=draftSpace();
  // Category picker ordered by how often each category has been used (most-used first),
  // ties broken by the category's original order.
  const usage={}; (sp.transactions||[]).forEach(t=>{ if(t.categoryId) usage[t.categoryId]=(usage[t.categoryId]||0)+1; });
  const cats=(sp.categories||[]).filter(c=>c.type===d.type)
    .map((c,i)=>({c,i,u:usage[c.id]||0}))
    .sort((a,b)=> b.u-a.u || a.i-b.i)

  const showChooser = d.type==='expense' && !isEdit && !isRec;  // Personal/Shared only on a fresh expense add

  const toggleBtns=`<button class="exp ${d.type==='expense'?'active':''}" onclick="setDraftType('expense')">Expense</button>
      <button class="inc ${d.type==='income'?'active':''}" onclick="setDraftType('income')">Income</button>`;
  const starBtn=`<button class="fav-star" onclick="openFavourites()" title="Favourites — quick add" aria-label="Favourites">⭐</button>`;
  let html=`<div class="grabber"></div>
    <div class="between"><h2 style="margin:0">${isRec?'Edit recurring':(isEdit?'Edit':'Add')} ${d.type}</h2>
      ${isEdit?`<button class="icon-btn" onclick="deleteTx('${d.id}')" title="Delete">🗑️</button>`:''}</div>`;
  if(showChooser){
    // type toggle + Personal/Shared chooser (+ ⭐ favourites) share one row to save vertical space
    html+=`<div class="addhead">
      <div class="type-toggle">${toggleBtns}</div>

          <button class="chip ${d.space==='personal'?'active':''}" onclick="setDraftSpace('personal')">Personal</button>

        ${starBtn}

/* =====================================================================
   CSV STATEMENT IMPORT  +  RECONCILIATION / AUDIT
   Fully client-side: the file is read in the browser and never uploaded.
   Flow: choose file → map columns → review 3 buckets → import.
   ===================================================================== */
const IMPORT_DATE_WINDOW = 5;   // days of drift allowed between statement & Nest (posting vs purchase)
const IMPORT_MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// keyword → default category NAME (resolved to the space's own category at import time)
const KEYWORD_CAT = [
  [/\b(loblaw|metro|sobeys|no ?frills|freshco|food ?basics|walmart|costco|superstore|grocer|zehrs|farm boy|whole foods|save on|t&t|galleria)/,"Groceries"],
  [/\b(tim horton|starbucks|coffee|cafe|café|second cup|mccafe|espresso)/,"Coffee"],
  [/\b(uber eats|doordash|skip ?the ?dishes|restaurant|pizza|sushi|mcdonald|a&w|wendy|burger|kfc|subway|chipotle|dining|kitchen|grill|thai|ramen|noodle|taco)/,"Restaurant"],
  [/\b(lcbo|beer store|bar |pub |brewery|wine|liquor|nightclub)/,"Going Out"],
  [/\b(presto|ttc|go transit|via rail|metrolinx|transit|subway fare)/,"Public Transit"],
  [/\b(uber|lyft|parking|petro|shell|esso|gas |fuel|chevron|husky)/,"Gas"],
  [/\b(netflix|spotify|disney|crave|prime video|apple\.com\/bill|youtube premium|hbo|hulu)/,"Streaming"],
  [/\b(cineplex|movie|theatre|theater|steam|playstation|xbox|nintendo|concert|ticketmaster)/,"Entertainment"],
  [/\b(amazon|amzn|ebay|aliexpress|etsy|best buy|canadian tire|dollarama|winners|ikea|shoppers)/,"Shopping"],
  [/\b(h&m|zara|uniqlo|gap|old navy|lululemon|nike|adidas|clothing|apparel|shoe)/,"Clothing"],
  [/\b(rogers|bell|telus|fido|koodo|virgin|freedom mobile|cell)/,"Cell Phone"],
  [/\b(hydro|enbridge|electric|water bill|utility)/,"Utilities"],
  [/\b(wifi|internet|beanfield|teksavvy)/,"Wifi"],
  [/\b(pharmacy|rexall|shoppers drug|dental|clinic|medical|doctor|physio)/,"Health / Medical"],
  [/\b(goodlife|planet fitness|fit4less|gym|crossfit|yoga)/,"Gym"],
  [/\b(rent|landlord|property mgmt|apartment)/,"Rent / Housing"],
  [/\b(insurance|intact|aviva|sonnet|belair)/,"Insurance"],
  [/\b(air canada|westjet|flight|expedia|airbnb|hotel|booking\.com|porter)/,"Travel"],
  [/\b(payroll|direct deposit|paydeposit|salary|paycheque|paycheck)/,"Job"],
];

function impDateDisp(iso){                 // "2026-09-06" -> "Sep 6"
  const p=(iso||'').split('-'); if(p.length<3) return iso||'';
  return IMPORT_MONTHS[(+p[1]||1)-1]+' '+(+p[2]);
}
function impDaysBetween(a,b){              // a,b = "YYYY-MM-DD"
  const da=new Date(a+'T00:00:00'), db=new Date(b+'T00:00:00');
  return Math.round(Math.abs(da-db)/86400000);
}
function impNormVendor(s){                 // for matching + learning key
  return (s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
}
function impVendorKey(s){                  // first up-to-2 alpha words, digits dropped
  const w=impNormVendor(s).replace(/\d+/g,' ').replace(/\s+/g,' ').trim().split(' ').filter(Boolean);
  return w.slice(0,2).join(' ');
}
function impCleanVendor(s){                // tidy raw description for display / storage
  return (s||'').replace(/\s+/g,' ').trim().slice(0,60);
}

/* ---- CSV parsing (RFC-4180-ish state machine) ---- */
function impDetectDelim(text){
  const line=(text.split(/\r?\n/).find(l=>l.trim())||'');
  const counts={',':0,';':0,'\t':0}; let q=false;
  for(const ch of line){ if(ch==='"') q=!q; else if(!q && counts[ch]!=null) counts[ch]++; }
  let best=',',n=-1; for(const d in counts){ if(counts[d]>n){ n=counts[d]; best=d; } }
  return best;
}
function impParseCSV(text, delim){
  text=text.replace(/^﻿/,'');         // strip BOM
  const rows=[]; let row=[], field='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i++; } else q=false; }
      else field+=c;
    } else {
      if(c==='"') q=true;
      else if(c===delim){ row.push(field); field=''; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; }
      else if(c==='\r'){ /* ignore */ }
      else field+=c;
    }
  }
  if(field!==''||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));   // drop blank lines
}

/* ---- value parsers ---- */
function impParseAmount(s){
  if(s==null) return NaN;
  s=String(s).trim(); if(!s) return NaN;
  let neg=false;
  if(/^\(.*\)$/.test(s)){ neg=true; s=s.slice(1,-1); }
  if(/(^|\s)(cr)\b/i.test(s)) {/* credit marker handled by caller via sign */}
  s=s.replace(/cr|dr/ig,'').replace(/[^0-9.\-]/g,'');   // strip $, commas, spaces, letters
  if(s.indexOf('-')>0) s=s.replace(/-/g,'');            // trailing/embedded stray dash
  let n=parseFloat(s); if(!isFinite(n)) return NaN;
  if(neg) n=-Math.abs(n);
  return n;
}
function impParseDate(s){
  if(!s) return null; s=String(s).trim();
  let m;
  // ISO  YYYY-MM-DD  or  YYYY/MM/DD
  if(m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/)){
    return impISO(m[1],m[2],m[3]);
  }
  // Textual  "Sep 6, 2026" / "6 Sep 2026"
  if(m=s.match(/^([A-Za-z]{3,})\.?\s+(\d{1,2}),?\s+(\d{4})/)){
    const mo=IMPORT_MONTHS.findIndex(x=>x.toLowerCase()===m[1].slice(0,3).toLowerCase());
    if(mo>=0) return impISO(m[3],mo+1,m[2]);
  }
  if(m=s.match(/^(\d{1,2})\s+([A-Za-z]{3,})\.?\s+(\d{4})/)){
    const mo=IMPORT_MONTHS.findIndex(x=>x.toLowerCase()===m[2].slice(0,3).toLowerCase());
    if(mo>=0) return impISO(m[3],mo+1,m[1]);
  }
  // Numeric  D/M/Y or M/D/Y  (2- or 4-digit year)
  if(m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{2,4})/)){
    let a=+m[1], b=+m[2], y=+m[3]; if(y<100) y+=2000;
    let mo,d;
    if(a>12){ d=a; mo=b; }         // clearly day-first
    else if(b>12){ mo=a; d=b; }    // clearly month-first
    else { mo=a; d=b; }            // ambiguous → month-first (MDY, Eric's default)
    return impISO(y,mo,d);
  }
  return null;
}
function impISO(y,m,d){
  y=+y; m=+m; d=+d;
  if(!y||!m||!d||m>12||d>31) return null;
  return y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
}

/* ---- category guessing ---- */
function impResolveCatByName(sp,name){
  return (sp.categories||[]).find(c=>c.type==='expense'&&c.name.toLowerCase()===name.toLowerCase());
}
function impGuessCat(desc,sp){
  const key=impVendorKey(desc);
  const learned=asArray(sp.vendorMap).find(v=>v.key===key);
  if(learned && (sp.categories||[]).some(c=>c.id===learned.categoryId)) return learned.categoryId;
  const nv=impNormVendor(desc);
  for(const [re,nm] of KEYWORD_CAT){ if(re.test(nv)){ const c=impResolveCatByName(sp,nm); if(c) return c.id; } }
  return '';
}
function impCatOptions(sp,selId){
  let o='<option value="">— pick —</option>';
  (sp.categories||[]).filter(c=>c.type==='expense').forEach(c=>{
    o+=`<option value="${c.id}" ${c.id===selId?'selected':''}>${c.icon} ${c.name}</option>`;
  });
  return o;
}

/* ---- step 1: choose file ---- */
function openImport(){
  importState={ step:'file' };
  const h=`<div class="grabber"></div><h2>Import statement</h2>
    <p class="sub" style="line-height:1.55">Upload a <b>CSV</b> exported from your bank or card. Everything happens on your phone — the file is never uploaded anywhere.</p>
    <label class="imp-drop">
      <input type="file" accept=".csv,text/csv" onchange="importFileChosen(this)" hidden>
      <div class="imp-drop-ic">📄</div>
      <div><b>Choose a CSV file</b></div>
      <div class="sub">Tap to browse</div>
    </label>
    <p class="sub" style="font-size:.8rem;line-height:1.5;margin-top:14px">Tip: most banks have a “Download / Export → CSV” button on the transactions page. We’ll then check it against Nest so you can catch anything you missed.</p>
    <button class="btn text block" onclick="closeSheet()">Cancel</button>`;

function importFileChosen(input){
  const f=input.files&&input.files[0]; if(!f) return;
  if(f.size>6*1024*1024){ toast('That file is very large — try a single statement'); return; }
  const r=new FileReader();
  r.onload=()=>{ try{ importParsed(String(r.result||'')); }catch(e){ toast('Could not read that file'); } };
  r.onerror=()=>toast('Could not read that file');
  r.readAsText(f);
}
function importParsed(text){
  const delim=impDetectDelim(text);
  const rows=impParseCSV(text,delim);
  if(rows.length<2){ toast('No rows found in that file'); return; }
  // header detection: first row looks like a header if it has no parseable date
  const first=rows[0];
  const hasHeader = !first.some(c=>impParseDate(c));
  const headers = hasHeader ? first.map(h=>impCleanVendor(h)) : first.map((_,i)=>'Column '+(i+1));
  const body = hasHeader ? rows.slice(1) : rows;
  importState={ step:'map', delim, headers, body, hasHeader };
  importAutoMap();
  renderImportMap();
}
function importAutoMap(){
  const st=importState, H=st.headers.map(h=>h.toLowerCase());
  const find=(...keys)=>H.findIndex(h=>keys.some(k=>h.includes(k)));
  let date=find('date','posted','transaction date');
  let desc=find('description','details','payee','merchant','memo','name','narration');
  let debit=find('debit','withdraw','money out','out');
  let credit=find('credit','deposit','money in','in');
  let amount=find('amount','value');
  // fall back to position/content scan when headers are generic
  if(date<0) date=st.body[0]?st.body[0].findIndex(c=>impParseDate(c)):-1;
  if(amount<0 && (debit<0||credit<0)){
    amount=st.body[0]?st.body[0].findIndex((c,i)=>i!==date && !isNaN(impParseAmount(c)) && /[0-9]/.test(c)):-1;
  }
  if(desc<0){
    desc=st.body[0]?st.body[0].findIndex((c,i)=>i!==date && i!==amount && isNaN(impParseAmount(c))):-1;
  }
  const mode=(debit>=0&&credit>=0)?'debitcredit':'single';

  else { m.debit=val('mpDebit'); m.credit=val('mpCredit'); }

function importBuildParsed(quiet){
  const st=importState, m=st.map, out=[];
  st.body.forEach(r=>{
    const date=impParseDate(r[m.date]);
    const desc=impCleanVendor(r[m.desc]);
    let amount=NaN, type='expense';
    if(m.mode==='single'){
      let n=impParseAmount(r[m.amount]);
      if(!isFinite(n)) return;
      const isExpense = m.signExpense ? n<0 : n>0;
      type = isExpense?'expense':'income';
      amount=Math.abs(n);
    } else {
      const d=m.debit>=0?impParseAmount(r[m.debit]):NaN;
      const c=m.credit>=0?impParseAmount(r[m.credit]):NaN;
      if(isFinite(d)&&Math.abs(d)>0){ type='expense'; amount=Math.abs(d); }
      else if(isFinite(c)&&Math.abs(c)>0){ type='income'; amount=Math.abs(c); }
      else return;
    }
    if(!isFinite(amount)||amount<=0) return;
    out.push({date, desc, amount, type});
  });
  return out;
}

function importToReview(){
  const parsed=importBuildParsed();
  if(!parsed.length){ toast('No transactions parsed — check the columns'); return; }
  const undated=parsed.filter(p=>!p.date).length;
  const good=parsed.filter(p=>p.date);
  if(!good.length){ toast('Could not read the dates — check the Date column'); return; }
  // date range of the statement
  const dates=good.map(p=>p.date).sort();
  const minD=dates[0], maxD=dates[dates.length-1];
  // pool of existing Nest transactions (own, from both spaces) to match against
  const pool=[];
  const addPool=(sp,which)=>{ if(!sp) return; asArray(sp.transactions).forEach(t=>pool.push({t,which,used:false})); };
  addPool(data.personal,'personal'); addPool(data.shared,'shared');
  const matched=[], missing=[];
  good.forEach(p=>{
    let best=-1, bestGap=IMPORT_DATE_WINDOW+1;
    pool.forEach((e,i)=>{
      if(e.used) return;
      if(e.t.type!==p.type) return;
      if(Math.abs((e.t.amount||0)-p.amount)>0.011) return;
      const gap=impDaysBetween(e.t.date,p.date);
      if(gap<=IMPORT_DATE_WINDOW && gap<bestGap){ best=i; bestGap=gap; }
    });
    if(best>=0){ pool[best].used=true; matched.push({p, nest:pool[best].t}); }
    else { missing.push(p); }
  });
  // Nest transactions inside the statement window that no statement row matched
  const nestOnly=pool.filter(e=>!e.used && e.t.date>=minD && e.t.date<=maxD)
                     .map(e=>({t:e.t, which:e.which}));
  // prep add-rows
  const base=data.personal;
  const rows=missing.map(p=>({
    p, include:true, shared:false,
    categoryId: impGuessCat(p.desc, base),
    vendor: p.desc
  }));
  importState.step='review';
  importState.review={ rows, matched, nestOnly, minD, maxD, undated,
    showMatched:false, showNest:false };
  renderImportReview();
}

/* Safe arithmetic evaluator for the amount field. Understands + - × ÷ only
   (no eval, no parentheses). Multiply/divide bind tighter than add/subtract.
   Returns NaN on anything invalid; tolerates a trailing operator (uses the
   valid part, so a half-typed "12+" reads as 12). */
function evalExpr(str){
  if(str==null) return NaN;
  const s=String(str).replace(/[×✕xX]/g,'*').replace(/÷/g,'/').replace(/[−–]/g,'-').replace(/,/g,'.').replace(/\s+/g,'');
  if(!s) return NaN;
  if(!/^[0-9.+\-*/]+$/.test(s)) return NaN;
  const toks=[]; let num='';
  for(const ch of s){
    if('+-*/'.includes(ch)){
      if(num===''){ if(toks.length===0) return NaN; return NaN; } // leading/double operator
      toks.push(parseFloat(num)); num=''; toks.push(ch);
    } else num+=ch;
  }
  if(num!=='') toks.push(parseFloat(num)); else toks.pop();      // drop a trailing operator
  if(!toks.length || typeof toks[0]!=='number' || isNaN(toks[0])) return NaN;
  if(toks.some(t=>typeof t==='number' && isNaN(t))) return NaN;
  const p=[toks[0]];                                             // pass 1: * and /
  for(let i=1;i<toks.length;i+=2){
    const op=toks[i], b=toks[i+1];
    if(typeof b!=='number') break;
    if(op==='*') p[p.length-1]*=b;
    else if(op==='/') p[p.length-1] = b===0?NaN : p[p.length-1]/b;
    else p.push(op,b);
  }
  let res=p[0];                                                  // pass 2: + and -
  for(let i=1;i<p.length;i+=2){ const op=p[i],b=p[i+1]; if(op==='+')res+=b; else if(op==='-')res-=b; }
  return res;
}
// Amount-buffer display: whole numbers show plain (6), fractionals always show 2 dp (6.60, not 6.6)
function trimNum(n){ n=Math.round((+n||0)*100)/100; return Number.isInteger(n) ? String(n) : n.toFixed(2); }
function renderAmt(){
  const a=addDraft.amount||'';
  const el=document.getElementById('amtNum');
  if(el){ el.textContent=a||'0'; el.classList.toggle('expr', /[+\-*/]/.test(a) || a.length>9); }
  const pv=document.getElementById('amtPreview');
  if(pv){
    if(/[+\-*/]/.test(a)){ const r=evalExpr(a); pv.textContent = isFinite(r)? '= '+CUR_SYMBOL+trimNum(r) : ''; }
    else pv.textContent='';
  }
  updateSplitHint();
}
function keyPress(k){
  let a=addDraft.amount||'';
  const isOp=c=>'+-*/'.includes(c);
  if(k==='⌫'){ a=a.slice(0,-1); }
  else if(k==='C'){ a=''; }
  else if(k==='='){ const r=evalExpr(a); if(isFinite(r)) a=trimNum(r); }
  else if('÷×−+-*/'.includes(k)){
    const op = k==='÷'?'/' : k==='×'?'*' : k==='−'?'-' : k;
    if(a==='') return;                              // no leading operator
    a = isOp(a[a.length-1]) ? a.slice(0,-1)+op : a+op;   // replace a trailing operator
  }
  else if(k==='.'){
    const seg=a.split(/[+\-*/]/).pop();
    if(seg.includes('.')) return;                  // one decimal per number
    a = (a===''||isOp(a[a.length-1])) ? a+'0.' : a+'.';
  }
  else {                                           // a digit
    if(a==='0') a='';
    const seg=a.split(/[+\-*/]/).pop();
    if(seg.includes('.') && seg.split('.')[1].length>=2) return; // max 2 decimals per number
    a=a+k;
  }
  addDraft.amount=a; renderAmt();
}
function saveTx(){
  const d=addDraft; const amt=evalExpr(d.amount);
  if(!isFinite(amt)||amt<=0){ toast('Enter a valid amount'); return; }
  if(!d.categoryId){ toast('Pick a category'); return; }
  if(!d.id && !d.recId && d.type==='expense' && !(d.vendor||'').trim()){ toast('Add a store / vendor'); return; }  // required on new adds only, not edits
  if(d._saving) return;                 // guard: ignore a second Save tap on the same entry
  d._saving=true;
  const sp=draftSpace(); const amtR=Math.round(amt*100)/100;
  const isSharedExp = d.space==='shared' && d.type==='expense';
  closeSheet();                         // close now so there is nothing left to double-tap

  // Recurring: edit an existing rule (from Plan → Recurring). Future auto-adds follow the new
  // schedule; entries already generated are left untouched.
  if(d.recId){
    const rule=asArray(sp.recurring).find(x=>x.id===d.recId);
    if(rule){
      rule.freq=d.repeat; rule.anchor=d.date; rule.amount=amtR; rule.categoryId=d.categoryId;
      rule.vendor=d.vendor.trim(); rule.note=d.note.trim(); rule.type=d.type;
      if(isSharedExp){ rule.paidBy=d.paidBy; rule.splitType=d.splitType; rule.customMine=d.customMine; rule.customPct=d.customPct; }
      else { delete rule.paidBy; delete rule.splitType; delete rule.customMine; delete rule.customPct; }
      runRecurring(sp);      // catch up any newly-due occurrences under the updated schedule (also saves)
      saveSpace(d.space);
      render();
      toast('Recurring updated');
    }
    return;
  }

  // Recurring: create a rule (only on a fresh add), then generate occurrences.
  if(!d.id && d.repeat && d.repeat!=='none'){
    const rule={id:uid(), freq:d.repeat, anchor:d.date, amount:amtR, categoryId:d.categoryId,
      vendor:d.vendor.trim(), note:d.note.trim(), type:d.type, active:true, lastGen:null};
    if(isSharedExp){ rule.paidBy=d.paidBy; rule.splitType=d.splitType; rule.customMine=d.customMine; rule.customPct=d.customPct; }
    sp.recurring=asArray(sp.recurring); sp.recurring.push(rule);
    runRecurring(sp); // generates + saves
    render();
    toast('Recurring '+d.type+' added');
    return;
  }

  const t={id:d.id||uid(), date:d.date, amount:amtR, categoryId:d.categoryId, vendor:d.vendor.trim(), note:d.note.trim(), type:d.type};
  if(isSharedExp){
    t.paidBy=d.paidBy;
    t.split=computeSplit(sp,amtR,d.paidBy,d.splitType,d.customMine,d.customPct);
  }
  sp.transactions=asArray(sp.transactions);
  if(d.id){ const i=sp.transactions.findIndex(x=>x.id===d.id); if(i>=0){ const o=sp.transactions[i]; if(o.recurringId!=null) t.recurringId=o.recurringId; if(o.occ!=null) t.occ=o.occ; sp.transactions[i]=t; } }
  else sp.transactions.push(t);
  saveSpace(d.space); render();
  toast(d.id?'Updated':'Added '+fmt(amt));
}
function deleteTx(id){
  const sp=draftSpace(); sp.transactions=asArray(sp.transactions).filter(t=>t.id!==id);
  saveSpace(addDraft.space); closeSheet(); render(); toast('Deleted');
}

// true = you pay partner; false = partner pays you.
let _settleYouPay = true;
function openSettle(){
  const sp=curSpace(); const bal=settleBalance(sp); if(!bal) return;
  // default direction: whoever owes pays (you owe -> you pay; partner owes you -> they pay).
  _settleYouPay = bal.net<=0;
  renderSettleSheet(true);
}
function settleSwap(){ _settleYouPay=!_settleYouPay; renderSettleSheet(false); }
function settleEvenAmt(bal){ return _settleYouPay ? Math.max(0,-bal.net) : Math.max(0,bal.net); }
function settleFull(){
  const bal=settleBalance(curSpace()); if(!bal) return;
  const el=document.getElementById('settleAmt'); if(el){ el.value=settleEvenAmt(bal).toFixed(2); settlePreview(); }
}
function fmtDay(ds){ return ds? new Date(ds+'T00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : ''; }
function renderSettleSheet(resetAmt){
  const sp=curSpace(); const bal=settleBalance(sp); if(!bal){ closeSheet(); return; }
  const payer=_settleYouPay?'You':bal.otherName;
  const payee=_settleYouPay?bal.otherName:'You';
  const even=settleEvenAmt(bal);
  const cur = resetAmt ? even : (parseFloat((document.getElementById('settleAmt')||{}).value)||0);
  const bLine = Math.abs(bal.net)<0.01 ? `You're all settled with ${bal.otherName}.`
     : bal.net>0 ? `${bal.otherName} currently owes you <b>${fmt(bal.net)}</b>.`
     : `You currently owe ${bal.otherName} <b>${fmt(-bal.net)}</b>.`;
  const sets=(sp.settlements||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  let hist='';
  if(sets.length){
    hist=`<div class="settle-hist"><div class="sub" style="margin:16px 0 4px;font-weight:700;color:var(--on-surface)">Past settle-ups</div>`;
    sets.forEach(s=>{
      const youPaid = s.from===user.uid;
      const nm=(sp.members[youPaid?s.to:s.from]&&sp.members[youPaid?s.to:s.from].name)||bal.otherName;
      const dir = youPaid?`You paid ${nm}`:`${nm} paid you`;
      hist+=`<div class="settle-row"><div><b>${fmt(+s.amount||0)}</b> <span class="muted">· ${dir}</span><div class="sub">${fmtDay(s.date)}</div></div>
        <button class="settle-del" onclick="deleteSettle('${s.id}')" title="Delete this settle-up">🗑️</button></div>`;
    });
    hist+=`</div>`;
  }
  const html=`<div class="grabber"></div><h2>Record a settle-up</h2>
    <p class="muted">${bLine} Log the whole amount, or just a portion.</p>
    <div class="settle-dir">
      <span class="settle-who">${payer}</span>
      <button class="settle-swap" onclick="settleSwap()" title="Swap who's paying">→</button>
      <span class="settle-who">${payee}</span>
    </div>
    <div class="sub" style="text-align:center;margin:0 0 14px">${_settleYouPay?'You transfer':payer+' transfers'} money to ${payee} · tap → to swap</div>
    <div class="field"><label>Transfer amount</label>
      <div class="flex"><span class="muted">${CUR_SYMBOL}</span>
        <input id="settleAmt" class="input" type="number" inputmode="decimal" step="0.01" value="${cur>0?cur.toFixed(2):''}" oninput="settlePreview()" placeholder="0.00"></div>
      ${even>0.005?`<button class="btn text" style="padding:8px 0;font-size:.82rem" onclick="settleFull()">Pay in full · ${fmt(even)}</button>`:''}
    </div>
    <div id="settlePrev" class="settle-prev"></div>
    <button class="btn filled block" onclick="recordSettle()">Record transfer</button>
    ${hist}`;
  openSheetHTML(html);
  settlePreview();
}
function settlePreview(){
  const bal=settleBalance(curSpace()); if(!bal) return;
  const el=document.getElementById('settlePrev'); if(!el) return;
  const amt=parseFloat((document.getElementById('settleAmt')||{}).value)||0;
  const newNet = _settleYouPay ? bal.net+amt : bal.net-amt;
  let msg='';
  if(amt>0){
    if(Math.abs(newNet)<0.01) msg=`✅ After this, you'll be all settled.`;
    else if(newNet>0) msg=`After this, ${bal.otherName} will owe you <b>${fmt(newNet)}</b>.`;
    else msg=`After this, you'll owe ${bal.otherName} <b>${fmt(-newNet)}</b>.`;
  }
  el.innerHTML=msg;
}
function recordSettle(){
  const sp=curSpace(); const bal=settleBalance(sp); if(!bal) return;
  const amt=parseFloat(document.getElementById('settleAmt').value)||0; if(amt<=0){toast('Enter an amount');return;}
  sp.settlements=asArray(sp.settlements);
  sp.settlements.push({id:uid(), date:todayStr(),
    from:_settleYouPay?user.uid:bal.other, to:_settleYouPay?bal.other:user.uid, amount:Math.round(amt*100)/100});
  saveSpace('shared'); render();
  toast('Recorded '+fmt(amt));
  renderSettleSheet(true); // keep sheet open, refreshed with the new balance + history
}
function deleteSettle(id){
  const sp=curSpace(); if(!sp) return;
  sp.settlements=asArray(sp.settlements).filter(s=>s.id!==id);
  saveSpace('shared'); render(); renderSettleSheet(true); toast('Removed');
}

function saveCatEdit(id){
  const c=catById(curSpace(),id); if(!c) return;
  const name=document.getElementById('ecName').value.trim(); if(!name){ toast('Name required'); return; }
  c.name=name; c.icon=document.getElementById('ecIcon').value.trim()||'•';
  const g=document.getElementById('ecGroup'); if(g) c.group=g.value;
  const poolCb=document.getElementById('ecPool');
  if(poolCb){
    if(poolCb.checked){
      c.pool=true; c.useIncomePct=false;                       // pools use a fixed $ set-aside
      const newSeed=+((document.getElementById('ecPoolSeed')||{}).value)||0;
      const nowYM=ymKey(new Date());
      // re-baselining the balance restarts accrual from today, so "balance today" stays honest
      if(!c.poolStart || newSeed!==(+c.poolSeed||0)) c.poolStart=nowYM;
      c.poolSeed=newSeed;
      c.poolTarget=+((document.getElementById('ecPoolTarget')||{}).value)||0;
      const td=((document.getElementById('ecPoolTargetDate')||{}).value||'').trim();
      c.poolTargetDate=/^\d{4}-\d{2}$/.test(td)?td:null;
    } else { c.pool=false; }                                   // keep seed/start/goal so re-enabling resumes
  }
  saveSpace(activeSpace); openSheet('managecats'); render(); toast('Category updated');
}

/* =====================================================================
   SHEET plumbing
   ===================================================================== */
function openSheetHTML(html){ const s=document.getElementById('sheet'); s.style.transition=''; s.style.transform=''; s.scrollTop=0; s.innerHTML=html; s.classList.add('show'); document.getElementById('scrim').classList.add('show'); }
// Re-render the open sheet WITHOUT jumping back to the top (for in-place toggles).
function openSheetHTMLKeep(html){ const s=document.getElementById('sheet'); const keep=(s&&s.classList.contains('show'))?s.scrollTop:0; openSheetHTML(html); const s2=document.getElementById('sheet'); if(s2&&keep) s2.scrollTop=keep; }
function closeSheet(){ const s=document.getElementById('sheet'); s.style.transition=''; s.style.transform=''; s.classList.remove('show'); const sc=document.getElementById('scrim'); sc.style.opacity=''; sc.classList.remove('show'); }

/* Phone back-gesture handling: a swipe-back first closes any open sheet
   (the add/edit "text boxes", settings, backups, etc.); if nothing is open
   it returns to the Home tab — instead of closing the whole app. We keep one
   dummy history entry ("guard") on top while the app is open and re-add it
   after each back, so the gesture is always caught. To leave the app, use the
   phone's Home button / app switcher. */
let _guardsUp=false;
function armNavGuard(){
  if(_guardsUp) return;
  // Keep TWO dummy entries so a single back never reaches the app's start URL —
  // some Android gesture handlers minimise the app the moment it does.
  try{ history.pushState({nest:1},''); history.pushState({nest:2},''); }catch(e){}
  _guardsUp=true;
}
function initBackButton(){
  window.addEventListener('popstate', ()=>{
    const appEl=document.getElementById('app');
    if(!appEl || appEl.classList.contains('hidden')){ _guardsUp=false; return; } // before sign-in: back behaves normally
    try{ history.pushState({nest:2},''); }catch(e){}   // restore the entry this back just consumed
    _guardsUp=true;
    const sheet=document.getElementById('sheet');
    if(sheet && sheet.classList.contains('show')){ closeSheet(); return; }   // 1) close an open sheet
    if(activeTab!=='home'){ setTab('home'); return; }                        // 2) jump to Home
    // 3) home & nothing open → do nothing (stay in the app)
  });
}

/* Drag-to-dismiss for the bottom sheet (mobile). The sheet follows your finger
   as you drag down and only closes past a threshold — otherwise it snaps back,
   so a small accidental swipe won't dismiss it. */
function initSheetGesture(){
  const sheet=document.getElementById('sheet'); const scrim=document.getElementById('scrim');
  if(!sheet) return;
  const DISMISS=110;            // px dragged before it closes
  let startY=0, curY=0, candidate=false, dragging=false;
  const start=(y,target)=>{
    dragging=false;
    // start a drag only from the grabber/header, or when the sheet is scrolled to the top
    const fromHandle = target && target.closest && target.closest('.grabber, h2, .between, .type-toggle, .addhead');
    candidate = !!fromHandle || sheet.scrollTop<=0;
    startY=y; curY=y;
  };
  const move=(y,ev)=>{
    if(!candidate) return;
    const dy=y-startY;
    if(!dragging){
      if(dy>6){ dragging=true; sheet.style.transition='none'; }   // downward intent -> begin drag
      else if(dy<-2){ candidate=false; return; }                  // moving up -> let content scroll
      else return;
    }
    curY=y;
    if(dy<=0){ sheet.style.transform='translateY(0)'; if(scrim) scrim.style.opacity=''; return; }
    if(ev && ev.cancelable) ev.preventDefault();                  // stop content scrolling while dragging
    sheet.style.transform='translateY('+dy+'px)';
    const h=sheet.offsetHeight||600;
    if(scrim) scrim.style.opacity=String(Math.max(0,1-dy/h));
  };
  const end=()=>{
    if(!candidate) return;
    candidate=false;
    const dy=curY-startY;
    sheet.style.transition='';                                    // restore the CSS ease
    if(scrim) scrim.style.opacity='';
    sheet.style.transform='';                                     // back to the .show position (or out, if closing)
    if(dragging && dy>DISMISS) closeSheet();
    dragging=false;
  };
  sheet.addEventListener('touchstart', e=>start(e.touches[0].clientY, e.target), {passive:true});
  sheet.addEventListener('touchmove',  e=>move(e.touches[0].clientY, e), {passive:false});
  sheet.addEventListener('touchend',   end);
  sheet.addEventListener('touchcancel',end);
}

/* Physical-keyboard entry for the amount while the Add/Edit sheet is open
   (mainly for desktop — type on the number pad instead of clicking the keypad).
   Number keys route to the on-screen keypad's keyPress; typing in the real
   text fields (vendor / note / date / split) is left alone. */
function initAmountKeyboard(){
  document.addEventListener('keydown', e=>{
    const sheet=document.getElementById('sheet');
    if(!sheet || !sheet.classList.contains('show')) return;
    if(!document.getElementById('amtNum')) return;         // only the Add/Edit sheet has the amount pad
    if(e.ctrlKey||e.metaKey||e.altKey) return;             // don't clobber shortcuts
    const k=e.key;
    if(k==='Escape'){ e.preventDefault(); closeSheet(); return; }
    const ae=document.activeElement;
    if(ae && (ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'||ae.tagName==='SELECT')) return; // let real fields type
    if(k>='0' && k<='9'){ e.preventDefault(); keyPress(k); }
    else if(k==='.'||k===','){ e.preventDefault(); keyPress('.'); }
    else if(k==='+'||k==='-'||k==='*'||k==='/'){ e.preventDefault(); keyPress(k); }   // math operators
    else if(k==='x'||k==='X'){ e.preventDefault(); keyPress('*'); }                    // x = multiply
    else if(k==='='){ e.preventDefault(); keyPress('='); }                             // evaluate in place
    else if(k==='Backspace'||k==='Delete'){ e.preventDefault(); keyPress('⌫'); }
    else if(k==='Enter'){ e.preventDefault(); saveTx(); }
  });
}
